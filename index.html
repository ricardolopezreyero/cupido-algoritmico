<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupido Algorítmico — No es una app de citas</title>
<meta name="description" content="Un sistema de detección de parejas. Solo te avisamos arriba del 95% de compatibilidad.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root{
    --bg:#0f0e11; --panel:#17161b; --ink:#efece6; --muted:#9b96a3;
    --accent:#e8637c; --accent2:#f0a35e; --line:#2a2830; --max:760px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;line-height:1.65;font-size:17px}
  header{padding:56px 20px 30px;text-align:center;
    background:radial-gradient(ellipse at top,#241d26 0%,var(--bg) 70%)}
  .logo{font-size:44px}
  h1.site{font-size:30px;margin:10px 0 6px;letter-spacing:.5px}
  .tag{color:var(--muted);font-style:italic;margin:0 auto;max-width:520px}
  .badge{display:inline-block;margin-top:18px;padding:6px 14px;border:1px solid var(--accent);
    border-radius:999px;color:var(--accent);font-size:14px;
    font-family:system-ui,-apple-system,sans-serif}
  nav{position:sticky;top:0;background:rgba(15,14,17,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;overflow-x:auto;
    justify-content:flex-start;padding:0 8px;z-index:9;
    font-family:system-ui,-apple-system,sans-serif}
  nav button{background:none;border:none;color:var(--muted);padding:14px 14px;
    font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  nav button.active{color:var(--ink);border-bottom-color:var(--accent)}
  main{max-width:var(--max);margin:0 auto;padding:28px 20px 80px}
  #content h1{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:10px}
  #content h2{font-size:21px;margin-top:38px;color:var(--accent2)}
  #content h3{font-size:18px;margin-top:30px}
  #content a{color:var(--accent)}
  #content blockquote{margin:20px 0;padding:12px 18px;border-left:3px solid var(--accent);
    background:var(--panel);color:var(--muted);font-style:italic;border-radius:0 8px 8px 0}
  #content code{background:var(--panel);padding:2px 6px;border-radius:4px;font-size:14px}
  #content pre{background:var(--panel);padding:16px;border-radius:10px;overflow-x:auto;
    font-size:13px;line-height:1.5}
  #content pre code{background:none;padding:0}
  #content table{border-collapse:collapse;width:100%;margin:18px 0;font-size:14.5px;
    font-family:system-ui,-apple-system,sans-serif;display:block;overflow-x:auto}
  #content th,#content td{border:1px solid var(--line);padding:9px 11px;text-align:left;
    vertical-align:top}
  #content th{background:var(--panel);color:var(--accent2)}
  #content hr{border:none;border-top:1px solid var(--line);margin:34px 0}
  #content strong{color:#fff}
  .loading{color:var(--muted);text-align:center;padding:60px 0;font-style:italic}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px 50px;
    border-top:1px solid var(--line);font-family:system-ui,sans-serif}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="logo">💘</div>
  <h1 class="site">Cupido Algorítmico</h1>
  <p class="tag">No es una app de citas. Es un sistema de detección de parejas.</p>
  <span class="badge">Solo te avisamos arriba del 95%</span>
</header>

<nav id="nav">
  <button data-doc="MANIFIESTO.md" class="active">Manifiesto</button>
  <button data-doc="README.md">La idea</button>
  <button data-doc="PREGUNTAS.md">Las preguntas</button>
  <button data-doc="MODELO.md">El modelo</button>
  <button data-doc="EXPERIENCIA.md">La experiencia</button>
</nav>

<main><div id="content" class="loading">Cargando…</div></main>

<footer>
  Proyecto abierto · <a href="https://github.com/ricardolopezreyero/cupido-algoritmico">GitHub</a>
</footer>

<script>
  const content = document.getElementById('content');
  const cache = {};
  async function load(doc){
    content.className='loading'; content.textContent='Cargando…';
    try{
      if(!cache[doc]){
        const r = await fetch(doc);
        if(!r.ok) throw new Error(r.status);
        cache[doc] = await r.text();
      }
      content.className='';
      content.innerHTML = marked.parse(cache[doc]);
      window.scrollTo({top:0});
    }catch(e){
      content.textContent = 'No se pudo cargar el documento.';
    }
  }
  document.querySelectorAll('nav button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      load(b.dataset.doc);
    });
  });
  load('MANIFIESTO.md');
</script>
</body>
</html>
