const _RLR = 'Ricardo López Reyero', _k = 'EYE', _rev = 181218;

/* ── sesión: cookie que puso el Worker (correo con enlace mágico, o demo) ── */
const salirA = (ruta) => location.replace(ruta);
const PRON = { mujer: ['ella', 'la'], hombre: ['él', 'lo'], nobinaria: ['esa persona', 'le'] };

tablero();

/* ═══ TABLERO ════════════════════════════════════════════════════════════ */
let V = null, seccion = 'inicio';
const cont = $('#contenido');

async function tablero() {
  try { V = await api('/api/yo'); }
  catch (e) { if (e.status === 401) salirA('/entrar'); else cont.innerHTML = `<p class="vacio">${esc(e.message)}</p>`; return; }
  document.title = `${V.persona.nombreCorto || 'Mi tablero'} · Cupido Algorítmico`;
  V.ajustes = aplicarEstilo(V.ajustes || (() => { try { return JSON.parse(localStorage.getItem('cupido.estilo') || '{}'); } catch { return {}; } })());
  const ds = $('#demo-switch'); ds.hidden = !V.sesion.demo; ds.onclick = abrirModalCuenta;
  ir(location.hash.slice(1) || 'inicio');
}
const DEMO = () => !!V?.sesion?.demo;

/* ── Mi estilo: 4 colores y 4 tipografías ───────────────────────────────── */
const COLORES_UI = [
  { id: 'rosa', n: 'Rosa Cupido', d: 'El original', c: ['#d6455f', '#1c1622', '#fbeef1'] },
  { id: 'vino', n: 'Vino', d: 'Serio y cálido', c: ['#8e2043', '#1f1116', '#f7ecef'] },
  { id: 'azul', n: 'Azul profundo', d: 'Sobrio, como un banco', c: ['#2f55c9', '#121729', '#edf1fc'] },
  { id: 'verde', n: 'Verde bosque', d: 'Tranquilo', c: ['#1f8a7a', '#10201d', '#e9f5f2'] },
];
const TIPOS_UI = [
  { id: 'clasica', n: 'Clásica', d: 'Fraunces + Inter', fam: "'Fraunces', Georgia, serif", link: null },
  { id: 'editorial', n: 'Editorial', d: 'Playfair + Source Sans', fam: "'Playfair Display', Georgia, serif", link: 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap' },
  { id: 'moderna', n: 'Moderna', d: 'Space Grotesk + Inter', fam: "'Space Grotesk', 'Inter', sans-serif", link: 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap' },
  { id: 'calida', n: 'Cálida', d: 'Lora + Nunito', fam: "'Lora', Georgia, serif", link: 'https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap' },
];
function cargarFuente(t) {
  if (!t?.link || document.querySelector(`link[data-fuente="${t.id}"]`)) return;
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = t.link; l.dataset.fuente = t.id; document.head.appendChild(l);
}
function aplicarEstilo(aj = {}) {
  const color = COLORES_UI.some((c) => c.id === aj.color) ? aj.color : 'rosa';
  const tipo = TIPOS_UI.some((t) => t.id === aj.tipo) ? aj.tipo : 'clasica';
  cargarFuente(TIPOS_UI.find((t) => t.id === tipo));
  if (color === 'rosa') delete document.documentElement.dataset.color; else document.documentElement.dataset.color = color;
  if (tipo === 'clasica') delete document.documentElement.dataset.tipo; else document.documentElement.dataset.tipo = tipo;
  try { localStorage.setItem('cupido.estilo', JSON.stringify({ color, tipo })); } catch {}
  return { color, tipo };
}
async function guardarEstilo(cambio) {
  V.ajustes = aplicarEstilo({ ...(V.ajustes || {}), ...cambio });
  try { const r = await api('/api/yo/ajustes', V.ajustes); V.ajustes = r.ajustes; } catch (e) { avisar(e.message); }
}
/* ── el interruptor no se apaga: se cambia por una cuenta propia ─────────── */
function abrirModalCuenta() {
  const pal = $('#demo-switch .pal');

  $('#modal-cuenta').classList.add('on'); setTimeout(() => $('#mc-correo')?.focus(), 200);
}
const cerrarModalCuenta = () => $('#modal-cuenta').classList.remove('on');
$('#mc-cerrar').onclick = cerrarModalCuenta; $('#mc-seguir').onclick = cerrarModalCuenta;
$('#modal-cuenta').onclick = (e) => { if (e.target.id === 'modal-cuenta') cerrarModalCuenta(); };
$('#mc-form').onsubmit = async (e) => {
  e.preventDefault();
  const correo = $('#mc-correo').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(correo)) { avisar('Ese correo no se ve bien. Revísalo.'); return; }
  const b = $('#mc-btn'); b.disabled = true; b.textContent = 'Mandando…';
  try {
    const r = await api('/api/entrar', { correo });
    $('#mc-form').hidden = true;
    const l = $('#mc-listo'); l.hidden = false;
    l.innerHTML = `<div class="enviado"><div class="grande">📬</div><h2>Revisa tu correo</h2><p>Te mandamos tu enlace a <b>${esc(r.correo)}</b>. Al abrirlo entras a tu propia cuenta y esta sesión demo se cierra.</p>
      ${r.sinCorreo ? `<p style="font-size:13px;background:var(--ambar-suave);padding:10px;border-radius:10px"><b>Modo desarrollo</b>: <a href="${esc(r.enlace)}">${esc(r.enlace)}</a></p>` : ''}
      <p class="nota-entrar">¿No llega? Revisa el spam. Vale 20 minutos.</p></div>`;
  } catch (err) { avisar(err.message); b.disabled = false; b.textContent = 'Crear mi cuenta →'; }
};

window.addEventListener('hashchange', () => V && ir(location.hash.slice(1)));

/* ── derivados: aceptaciones, logros y camino ────────────────────────────── */
function derivados() {
  const c = V.coincidencias, P = V.persona, r = V.misRespuestas || {};
  const esperanMi = c.filter((x) => x.puerta.estado !== 'abierta' && !x.puerta.miDecision);
  const miSi = c.filter((x) => x.puerta.estado !== 'abierta' && x.puerta.miDecision === 'si');
  const abiertas = c.filter((x) => x.puerta.estado === 'abierta');
  const miNo = c.filter((x) => x.puerta.estado !== 'abierta' && x.puerta.miDecision === 'no');
  const logros = [
    { m: '📝', t: 'Cuestionario completo', d: 'Las 43 preguntas', ok: P.avance.listo },
    { m: '🔐', t: 'Módulo profundo', d: 'Intimidad y vida interior', ok: !!(r.deseo && r.sx_esperar && (r.practicas || []).length) },
    { m: '✉️', t: 'Carta escrita', d: 'Lo primero que leerá tu match', ok: String(r.carta || '').length > 80 },
    { m: '🔎', t: 'Te conoce bien', d: 'Claridad de 80 % o más', ok: V.claridad.pct >= 80 },
    { m: '💘', t: 'Primera coincidencia', d: `Alguien cruzó el ${V.umbral} %`, ok: c.length > 0 },
    { m: '🌟', t: 'Arriba del 95 %', d: 'Una coincidencia excepcional', ok: c.some((x) => x.pct >= 95) },
    { m: '🤍', t: 'Dijiste que sí', d: 'Te animaste a conocer', ok: miSi.length + abiertas.length > 0 },
    { m: '🔓', t: 'Puerta abierta', d: 'Los dos dijeron que sí', ok: abiertas.length > 0 },
    { m: '📷', t: 'Con rostro y voz', d: 'Foto, voz y video listos', ok: !!(V.misMedios?.foto && V.misMedios?.audio && V.misMedios?.video) },
  ];
  const pasos = [
    { i: '📝', t: 'Responder', d: 'tus 43 preguntas', ok: P.avance.listo },
    { i: '⚙️', t: 'Entrar al matching', d: P.estado === 'pausada' ? 'perfil en pausa' : 'el motor te cruza', ok: P.completo && P.estado === 'activa' },
    { i: '💘', t: 'Coincidencia', d: `alguien arriba del ${V.umbral} %`, ok: c.length > 0 },
    { i: '🤍', t: 'Tu sí', d: 'decides conocer', ok: miSi.length + abiertas.length > 0 },
    { i: '🔓', t: 'Puerta abierta', d: 'se conocen', ok: abiertas.length > 0 },
  ];
  return { esperanMi, miSi, abiertas, miNo, logros, pasos, nuevos: V.avisos.filter((a) => !a.leido).length };
}

const miAvatar = (P, clase = '') => V.misMedios?.foto ? `<img class="avatar foto ${clase}" src="${esc(V.misMedios.foto.url)}" alt="">` : avatar(P.nombre === 'Sin nombre' ? '♥' : P.nombre, P.color, clase);
const avatarDe = (r, clase = '') => r.medios?.foto ? `<img class="avatar foto ${clase}" src="${esc(r.medios.foto.url)}" alt="${esc(r.nombre)}">` : avatar(r.nombre, r.color, clase);

/* ── menú lateral en el orden del camino ─────────────────────────────────── */
const MENU = [
  { sep: 'Mi búsqueda' },
  { s: 'inicio', i: '🏠', t: 'Inicio' },
  { s: 'coincidencias', i: '💘', t: 'Mis coincidencias', n: () => V.coincidencias.length },
  { s: 'aceptaciones', i: '🤝', t: 'Aceptaciones', n: (d) => d.esperanMi.length, alerta: true },
  { s: 'charlas', i: '💬', t: 'Charlas', n: () => (V.charlas || []).reduce((s, c) => s + c.nuevos, 0), alerta: true },
  { s: 'avisos', i: '🔔', t: 'Avisos', n: (d) => d.nuevos, alerta: true },
  { sep: 'Mi perfil' },
  { s: 'pesos', i: '🧭', t: 'Lo que más pesa' },
  { s: 'respuestas', i: '📋', t: 'Mis respuestas' },
  { s: 'vida', i: '🧭', t: 'Mi vida hoy' },
  { s: 'medios', i: '📷', t: 'Foto, voz y video', n: () => (V.persona.completo && !(DEMO() && V.persona.origen === 'demo') ? 3 - Object.keys(V.misMedios || {}).length : 0), alerta: false },
  { s: 'claridad', i: '🔎', t: 'Qué tan bien me conoce' },
  { s: 'filtros', i: '🚧', t: 'Lo que me deja fuera', n: () => V.dejanFuera.length },
  { sep: 'Cuenta' },
  { s: 'estilo', i: '🎨', t: 'Mi estilo' },
  { s: 'privacidad', i: '🔒', t: 'Privacidad y pausa' },
];
function pintarLateral() {
  const d = derivados(), P = V.persona;
  $('#quien-lat').innerHTML = `<a href="#medios" class="avatar-enlace" title="Cambiar mi foto">${miAvatar(P)}<span class="lapiz">✎</span></a><div><b>${esc(P.nombre === 'Sin nombre' ? 'Tu cuenta' : P.nombre)}</b><span>${P.edad ? esc(P.edad) + ' · ' : ''}${esc(P.ciudad || '')}</span></div>`;
  $('#nav').innerHTML = MENU.map((m) => {
    if (m.sep) return `<div class="sep">${m.sep}</div>`;

  $('#pie-lat').innerHTML = DEMO() ? 'Demo con datos ficticios.<br><a href="/admin">Ver el panel admin →</a>' : `Sin contraseña: entras con tu correo.${V.sesion.correo ? `<br><span style="word-break:break-all">${esc(V.sesion.correo)}</span>` : ''}`;
}
$('#abrir-menu').onclick = () => { $('#lateral').classList.add('on'); $('#velo').classList.add('on'); };
const cerrarMenu = () => { $('#lateral').classList.remove('on'); $('#velo').classList.remove('on'); };
$('#velo').onclick = cerrarMenu;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarMenu(); });
$('#salir').onclick = async () => {
  try { await api('/api/salir', {}); } catch {}

};

let parametro = null;
function ir(s) {
  const [base, ...resto] = String(s || '').split('/');
  parametro = resto.length ? resto.join('/') : null;
  s = base;
  seccion = SECCIONES[s] ? s : 'inicio';
  if (s !== 'charlas') detenerCharla();
  cerrarMenu();
  pintarLateral();
  cont.innerHTML = `<div class="seccion-admin">${SECCIONES[seccion]()}</div>`;
  window.scrollTo(0, 0);
  pronto(() => { $$('.relleno[data-w]').forEach((b) => b.style.width = b.dataset.w + '%'); animarAnillos(cont); });
  $$('[data-decision]').forEach((b) => b.onclick = () => decidir(b.dataset.clave, b.dataset.decision, b));
  (DESPUES[seccion] || (() => {}))();
}
const cabeza = (t, sub, acc = '') => `<div class="cabeza-admin"><div><h1>${t}</h1><p>${sub}</p></div><div class="acciones">${acc}</div></div>`;

/* ═══ SECCIONES (en el orden del menú) ══════════════════════════════════ */
const SECCIONES = {
  inicio() {
    const d = derivados(), P = V.persona, c = V.coincidencias;
    const ganados = d.logros.filter((l) => l.ok).length;
    const actual = d.pasos.findIndex((p) => !p.ok);
    const siguiente = d.logros.find((l) => !l.ok);
    const mejor = c[0];
    const estado = !P.completo ? ['ambar', 'Tu perfil aún no entra al matching'] : P.estado === 'pausada' ? ['ambar', 'Tu perfil está en pausa'] : ['ok', 'En el matching'];
    return cabeza(`Hola${P.nombreCorto ? ', ' + esc(P.nombreCorto) : ''}.`, `<span class="chip ${estado[0]}">${estado[1]}</span> &nbsp;Tu búsqueda, en una sola pantalla.`,
      d.esperanMi.length ? `<a class="boton" href="#aceptaciones">Responder ${d.esperanMi.length} ${d.esperanMi.length === 1 ? 'coincidencia' : 'coincidencias'}</a>` : !P.completo ? `<a class="boton" href="/cuestionario">Responder mi cuestionario</a>` : `<a class="boton boton-claro" href="#coincidencias">Ver coincidencias</a>`) +
      (!DEMO() && !P.completo ? `<div class="cinta-demo" style="background:var(--rosa-suave);border-color:var(--rosa-linea);color:var(--tinta-2)"><span>✨</span><span><b>Bienvenido${P.nombreCorto ? ', ' + esc(P.nombreCorto) : ''}.</b> Tu tablero se llena conforme respondes. Si quieres ver todo lo que puedes hacer aquí, el recorrido dura dos minutos.</span><a class="boton boton-claro boton-chico" href="/bienvenida">Ver el recorrido</a></div>` : '') +
      (DEMO() ? `<div class="cinta-demo"><span>🎛️</span><span><b>Estás en la cuenta demo</b>, viendo el tablero de ${esc(P.nombre)}, una persona ficticia. Todo lo que ves es real en el sistema: coincidencias, puertas, avisos. Así verías el tuyo.</span><button class="boton boton-chico" id="crear-cuenta">Quiero mi propia cuenta</button></div>` : '') + `
      <div class="banda">
        <div class="rosa"><b>${c.length}</b><span>coincidencias<br>arriba del ${V.umbral} %</span></div>
        <div><b>${d.esperanMi.length}</b><span>esperan<br>tu respuesta</span></div>
        <div><b>${d.miSi.length}</b><span>con tu sí,<br>esperando</span></div>
        <div><b>${d.abiertas.length}</b><span>puertas<br>abiertas</span></div>
        <div><b>${V.pool.compatibles}</b><span>pasan los filtros<br>de los dos</span></div>
        <div><b>${V.claridad.pct}<small style="font-size:18px"> %</small></b><span>qué tan bien<br>te conoce</span></div>
      </div>
      <section class="tarjeta"><h2>Tu camino</h2><p class="sub">Cinco pasos. Los primeros dependen de ti; el último, de los dos.</p>
        <div class="camino">${d.pasos.map((p, i) => `<div class="paso-c ${p.ok ? 'hecho' : i === actual ? 'actual' : ''}"><div class="bola">${p.ok ? '✓' : p.i}</div><div><b>${p.t}</b><span>${p.d}</span></div></div>`).join('')}</div>
      </section>
      <div class="rejilla-2" style="margin-top:16px">
        <section class="tarjeta"><h2>Tu mejor coincidencia</h2>
          ${mejor ? `<div class="nivel">${anillo(mejor.pct)}<div><h3>${mejor.puerta.estado === 'abierta' ? esc(mejor.revelado.nombre) : `Alguien al ${mejor.pct} %`}</h3>
            <p>${esc(mejor.fuertes[0]?.txt || '')}</p><p style="margin-top:8px"><a class="enlace" href="#coincidencias">Ver el detalle →</a></p></div></div>`
            : `<div class="nivel"><div class="anillo" style="display:flex;align-items:center;justify-content:center;font-size:36px">🌙</div><div><h3>Todavía en silencio</h3><p>${V.masCerca ? `Lo más cerca que alguien ha estado de ti: <b>${V.masCerca} %</b>.` : 'Aún no hay a quién comparar.'} Te avisamos en cuanto alguien cruce el ${V.umbral} %.</p></div></div>`}
        </section>
        <section class="tarjeta" style="margin-top:0"><h2>Tu avance</h2>
          <div class="nivel">${anillo(Math.round(100 * ganados / d.logros.length), 'logros')}<div><h3>${ganados} de ${d.logros.length} logros</h3><p>${siguiente ? `Siguiente: <b>${esc(siguiente.t)}</b> — ${esc(siguiente.d.toLowerCase())}.` : 'Completaste todo el recorrido.'}</p></div></div>
        </section>
      </div>
      <section class="tarjeta" style="margin-top:16px"><h2>Logros</h2><p class="sub">No son puntos para competir: son las señales de que tu búsqueda va en serio.</p>
        <div class="logros">${d.logros.map((l) => `<div class="logro ${l.ok ? '' : 'bloqueado'}"><div class="medalla">${l.ok ? l.m : '🔒'}</div><b>${l.t}</b><span>${l.d}</span></div>`).join('')}</div>
      </section>
      <section class="tarjeta" style="margin-top:16px"><h2>Últimos avisos</h2>
        <div class="avisos-lista">${V.avisos.slice(0, 3).map(filaAviso).join('') || '<p class="vacio">Sin avisos todavía.</p>'}</div>
        ${V.avisos.length > 3 ? '<p style="margin:10px 0 0"><a class="enlace" href="#avisos">Ver todos →</a></p>' : ''}
      </section>`;
  },

  coincidencias() {
    return cabeza('Mis coincidencias', `Solo de ${V.umbral} % hacia arriba, ordenadas. Nadie ve tu perfil y la identidad de la otra persona está protegida hasta que los dos digan que sí.`) +
      (V.coincidencias.length ? V.coincidencias.map(tarjetaCoincidencia).join('') : silencio());
  },

  aceptaciones() {
    const d = derivados();
    const fila = (c, acciones) => `<div class="fila-acept"><span class="pct">${c.pct} %</span>
      <div class="que"><b>${c.puerta.estado === 'abierta' ? esc(c.revelado.nombreCompleto) : 'Identidad protegida'}</b><span>${esc(c.fuertes.map((f) => f.dim).join(' · '))}</span></div>
      <div class="acciones">${acciones}</div></div>`;
    const grupo = (titulo, chip, lista, vacio, acc) => `<section class="tarjeta grupo-acept"><h3>${titulo} <span class="chip ${chip}">${lista.length}</span></h3>
      ${lista.length ? lista.map((c) => fila(c, acc(c))).join('') : `<p class="vacio" style="margin:0">${vacio}</p>`}</section>`;
    return cabeza('Aceptaciones', 'Aquí decides. Tu respuesta nunca se le muestra a la otra persona: la puerta solo se abre con dos síes, y un no jamás se entera.') +
      grupo('⏳ Esperan tu respuesta', 'ambar', d.esperanMi, 'No tienes coincidencias pendientes de responder.', (c) =>
        `<button class="boton boton-chico" data-clave="${esc(c.clave)}" data-decision="si">Sí, quiero conocer</button><button class="boton boton-fantasma boton-chico" data-clave="${esc(c.clave)}" data-decision="no">Ahora no</button>`) +
      grupo('🤍 Dijiste que sí · esperando', 'gris', d.miSi, 'Aún no has dicho que sí a nadie.', (c) =>
        `<span class="chip gris">Tu sí está guardado</span><button class="enlace" data-clave="${esc(c.clave)}" data-decision="no">Cambiar de opinión</button>`) +
      grupo('🔓 Puertas abiertas', 'ok', d.abiertas, 'Cuando haya dos síes, la puerta aparecerá aquí.', (c) =>
        `<a class="boton boton-chico" href="#charlas/${esc(otraDe(c))}">💬 Abrir la charla</a><a class="boton boton-claro boton-chico" href="#coincidencias">Leer su carta</a>`) +
      grupo('🌙 Preferiste no abrir', 'gris', d.miNo, 'Nada por aquí.', (c) =>
        `<button class="boton boton-claro boton-chico" data-clave="${esc(c.clave)}" data-decision="si">Reconsiderar</button>`);
  },

  charlas() {
    const lista = V.charlas || [];
    if (parametro) return vistaCharla(parametro);
    return cabeza('Charlas', 'Una charla por cada puerta abierta. Aquí nadie ve tu perfil hasta que tú lo compartes, elemento por elemento.') +
      (lista.length ? `<section class="tarjeta" style="padding:6px 0"><div class="charlas-lista">${lista.map((c) => `<a class="charla-fila" href="#charlas/${esc(c.otra)}">${avatar(c.nombre, c.color)}<div><b>${esc(c.nombre)}</b><span>${c.ultimo ? `${c.ultimo.mio ? 'Tú: ' : ''}${esc(String(c.ultimo.texto || '').slice(0, 80))}` : 'Sin mensajes'}</span></div>${c.nuevos ? `<span class="cuenta-nav">${c.nuevos}</span>` : `<span class="cuando">${c.ultimo ? hace(c.ultimo.creado) : ''}</span>`}</a>`).join('')}</div></section>`
        : `<section class="tarjeta"><div class="nivel"><div class="anillo" style="display:flex;align-items:center;justify-content:center;font-size:36px">💬</div><div><h3>Todavía no hay charlas</h3><p>Nacen solas cuando una puerta se abre: los dos dicen que sí y el sistema manda el primer hola de parte de cada uno.</p></div></div></section>`);
  },

  avisos() {
    return cabeza('Avisos', 'Cada coincidencia nueva y cada puerta abierta. Te avisamos a ti y a la otra persona al mismo tiempo.') +
      `<section class="tarjeta"><div class="avisos-lista" style="margin:0">${V.avisos.map(filaAviso).join('') || '<p class="vacio">Sin avisos todavía.</p>'}</div></section>`;
  },

  pesos() {
    return cabeza('Lo que más pesa en tu cálculo', 'No te preguntamos qué te importa: lo deducimos de lo que haces y de lo que declaraste negociable. Lo morado subió por tus propias respuestas.') + `
      <section class="tarjeta"><div class="barras">${V.pesos.map((w) => `
        <div class="barra-fila"><span>${esc(w.dim)}</span><div class="pista"><div class="relleno ${w.por ? 'sube' : ''}" data-w="${Math.min(100, w.pct * 4)}"></div></div><b>${w.pct} %</b>
        ${w.por ? `<span class="por">↑ ${esc(w.por)}</span>` : ''}</div>`).join('')}</div>
        <p class="seccion-sub" style="margin:16px 0 0">Conflicto y reparación y valores nunca bajan de su peso base: son lo que más predice que una pareja dure, aunque no lo parezca.</p></section>`;
  },

  respuestas() {
    const r = V.misRespuestas || {};
    if (!V.persona.avance.estructuradas && !DEMO()) return cabeza('Mis respuestas', 'Todavía no has respondido nada.', `<a class="boton" href="/cuestionario">Empezar mi cuestionario</a>`) + `<section class="tarjeta"><p style="margin:0;color:var(--tinta-2)">Son 43 preguntas en 10 categorías. Se guardan solas y puedes parar cuando quieras.</p></section>`;
    const lleno = (v) => v != null && v !== '' && !(Array.isArray(v) && !v.length);
    const bloques = Object.entries(BLOQUES).map(([n, nombre]) => {
      const preguntas = PREGUNTAS.filter((p) => p.b === Number(n));
      const partes = preguntas.flatMap((p) => p.parts.flatMap((pt) => pt.k === 'grid' ? pt.rows.map(([rid]) => rid) : (pt.si && r[pt.si.id] !== pt.si.v ? [] : [pt.id])));
      const hechas = partes.filter((k) => lleno(r[k])).length;
      const pct = Math.round(100 * hechas / Math.max(1, partes.length));
      return `<details class="tarjeta bloque-resp" style="padding:0 18px">
        <summary><span class="n">${n}</span>${esc(nombre)}<div class="mini"><div class="pista"><div class="relleno" style="width:${pct}%;background:${pct === 100 ? 'var(--ok)' : 'var(--rosa)'}"></div></div><b>${pct}%</b></div></summary>
        ${preguntas.map((p) => {
          const vals = p.parts.flatMap((pt) => pt.k === 'grid' ? pt.rows.map(([rid, rl]) => ({ id: rid, l: rl })) : [pt]).filter((pt) => lleno(r[pt.id]));
          return `<div class="preg"><b>${p.n}. ${esc(p.t)}</b>${vals.length ? vals.map((pt) => {
            const v = r[pt.id], k = PARTE[pt.id]?.k;
            const txt = k === 'range' ? `${v[0]} a ${v[1]} años` : k === 'text' ? esc(v) : esc(etiqueta(pt.id, v));
            return `<div>${pt.l ? `<span style="color:var(--gris)">${esc(pt.l)}:</span> ` : ''}${txt}</div>`;
          }).join('') : '<div class="vacio">Sin responder</div>'}
          ${DEMO() ? '' : `<a class="enlace" style="font-size:13px" href="/cuestionario?p=${p.n}">Editar</a>`}</div>`;
        }).join('')}
      </details>`;
    }).join('');
    return cabeza('Mis respuestas', `Las 43 preguntas en sus 10 categorías, en el orden del cuestionario. Avance total: ${V.persona.avance.pct} %.`,
      DEMO() ? `<button class="boton boton-claro" id="crear-cuenta">Responder el mío</button>` : `<a class="boton boton-claro" href="/cuestionario">Editar cuestionario</a>`) +
      `<p class="seccion-sub">Solo tú las ves. Lo íntimo solo lo lee el motor.</p>${bloques}`;
  },

    const v = vidaActual();

      <div class="rejilla-2 vida-rejilla">
        <section class="tarjeta"><h2>Los elementos</h2><p class="sub">Mueve cada uno hasta donde sientas que está. Se guarda solo.</p>
          <div class="vida-lista">${AREAS_VIDA.map((a) => `<div class="vida-fila"><span class="ico">${a.i}</span><div><b>${a.n}</b><small>${a.d}</small>
            <input type="range" min="0" max="100" step="5" value="${v[a.id] ?? 50}" data-vida="${a.id}" aria-label="${a.n}"></div><output id="v-${a.id}">${v[a.id] ?? 50} %</output></div>`).join('')}</div></section>
        <section class="tarjeta" style="margin-top:0"><h2>Cómo te ves</h2><p class="sub">Tu figura de hoy. Cuando la vuelvas a mover, cambia contigo.</p>

  medios() {

        <p>Vas en <b>${P.avance.pct} %</b>. Aquí no se elige a nadie por la foto: primero lo que eres, al final cómo te ves. Cuando termines, podrás subir tu foto, grabar tu voz y un video corto.</p>

    return cabeza('Foto, voz y video', 'Solo lo ve la persona con quien se abrió una puerta. Nadie lo ve antes: primero quién eres, al final cómo te ves.') + `
      <div class="cinta-demo" style="background:var(--rosa-suave);border-color:var(--rosa-linea);color:var(--tinta-2)"><span>🔐</span><span>Estos archivos <b>no aparecen en ninguna lista</b>. Se muestran una sola vez: cuando los dos dijeron que sí.</span></div>
      ${bloque('foto', '📷', 'Tu foto', 'Una foto donde se te vea la cara, con luz natural. La ajustamos nosotros.', M.foto ? `<img src="${esc(M.foto.url)}" alt="Tu foto">` : `<div class="medio-vacio">${avatar(P.nombre === 'Sin nombre' ? '♥' : P.nombre, P.color, 'xl')}<span>Hoy te representa tu inicial.</span></div>`, 'image/*')}
      ${bloque('audio', '🎙️', 'Tu voz', 'Lee tu carta en voz alta, o cuenta tu martes. Hasta 90 segundos.', M.audio ? `<audio controls preload="metadata" src="${esc(M.audio.url)}"></audio>` : `<div class="medio-vacio"><span style="font-size:34px">🎙️</span><span>Todavía no hay voz.</span></div>`, 'audio/*')}
      ${bloque('video', '🎬', 'Tu video', 'Un video corto y sin producción: tú, hablando como hablas. Hasta 45 segundos.', M.video ? `<video controls playsinline preload="metadata" src="${esc(M.video.url)}"></video>` : `<div class="medio-vacio"><span style="font-size:34px">🎬</span><span>Todavía no hay video.</span></div>`, 'video/*')}`;
  },

  claridad() {
    const rb = V.rubrica || {};
    const EJES = [['autoconocimiento', 'Autoconocimiento', 'Qué tanto te miras con honestidad'], ['responsabilidad', 'Responsabilidad', 'Cómo asumes tu parte en los conflictos'], ['calidez', 'Calidez', 'Cómo cuidas, con ejemplos reales'], ['coherencia', 'Coherencia', 'Que tus respuestas no se contradigan']];
    const preguntas = [...new Set(V.claridad.flojas.flatMap((f) => f.preguntas))].sort((a, b) => a - b);
    return cabeza('Qué tan bien me conoce el algoritmo', 'Tus respuestas abiertas le dicen al motor qué tan clara es la imagen que tiene de ti. La calidad de una pareja la define el menos claro de los dos.') + `
      <div class="rejilla-2">
        <section class="tarjeta"><div class="nivel">${anillo(V.claridad.pct, 'claridad')}<div><h3>${V.claridad.pct >= 80 ? 'Te describiste con claridad' : V.claridad.pct >= 50 ? 'Te conoce a medias' : 'Te conoce poco'}</h3>
          <p>${preguntas.length ? `Tus coincidencias serían más certeras si le cuentas más en las preguntas ${preguntas.map((n) => DEMO() ? n : `<a href="/cuestionario?p=${n}">${n}</a>`).join(', ')}. No se trata de escribir bonito: se trata de escribir verdad, con ejemplos.` : 'Escribiste con ejemplos reales. Eso hace que tus coincidencias sean de verdad tuyas.'}</p></div></div></section>
        <section class="tarjeta" style="margin-top:0"><h2>Los cuatro ejes</h2>
          <div class="barras">${EJES.map(([k, t, dsc]) => `<div class="barra-fila" style="grid-template-columns:150px 1fr 40px"><span>${t}</span><div class="pista"><div class="relleno" data-w="${(rb[k] ?? 0) * 10}"></div></div><b>${rb[k] ?? '—'}</b><span class="por" style="color:var(--gris)">${dsc}</span></div>`).join('')}</div></section>
      </div>`;
  },

  filtros() {
    const QUE = { edad: 'Tu rango de edad', distancia: 'Que ni tú ni la otra persona se moverían de ciudad', alcohol: 'Tu filtro de alcohol', tabaco: 'Tu filtro de tabaco', comida: 'Tu filtro de comida (solo alguien que se cuida)', mascotas: 'Tu filtro de mascotas' };
    return cabeza('Lo que me deja fuera', 'Solo te mostramos filtros que tú podrías reconsiderar. Nunca te sugeriremos negociar hijos, fe, exclusividad ni tus límites íntimos.') + `
      <section class="tarjeta">${V.dejanFuera.length ? `<ul class="razones" style="padding:0">${V.dejanFuera.map((x) => `<li><span class="i ojo">!</span><span>${QUE[x.id] || 'Uno de tus filtros'} deja fuera a <b>${x.personas}</b> ${x.personas === 1 ? 'persona' : 'personas'} con quien tendrías hasta <b>${x.mejor} %</b>${x.mejor >= V.umbral ? ' — arriba del umbral' : ''}.</span></li>`).join('')}</ul>`
        : '<p style="margin:0;color:var(--tinta-2)">Tus filtros no están dejando fuera a nadie con quien tendrías una compatibilidad alta. 👌</p>'}
        <div class="estado-pool" style="margin-top:18px"><div><b>${V.pool.delOtroLado}</b><span>personas del otro lado</span></div><div><b>${V.pool.compatibles}</b><span>pasan los filtros de los dos</span></div><div><b>${V.masCerca ?? '—'}</b><span>lo más cerca bajo el ${V.umbral} %</span></div></div>
      </section>`;
  },

  estilo() {
    const aj = V.ajustes || {};
    return cabeza('Mi estilo', 'Tu tablero, a tu gusto. Elige un color y una tipografía; se guardan en tu cuenta.') + `
      <section class="tarjeta"><h2>Color</h2><p class="sub">Cambia los botones, los acentos y la barra lateral.</p>
        <div class="estilos">${COLORES_UI.map((c) => `<button class="estilo ${(aj.color || 'rosa') === c.id ? 'on' : ''}" data-color="${c.id}"><div class="muestra">${c.c.map((x) => `<span style="background:${x}"></span>`).join('')}</div><b>${c.n}</b><small>${c.d}</small></button>`).join('')}</div></section>
      <section class="tarjeta"><h2>Tipografía</h2><p class="sub">Cambia los títulos y el texto de todo el tablero.</p>
        <div class="estilos">${TIPOS_UI.map((t) => `<button class="estilo ${(aj.tipo || 'clasica') === t.id ? 'on' : ''}" data-tipo="${t.id}"><div class="tipo-muestra" style="font-family:${t.fam}">Cupido<em>${t.d}</em></div><b>${t.n}</b></button>`).join('')}</div></section>
      <p class="seccion-sub">${DEMO() && V.persona.origen === 'demo' ? 'En la cuenta demo el estilo se recuerda solo en este dispositivo.' : 'Se aplica en todos tus dispositivos al entrar con tu correo.'}</p>`;
  },

  privacidad() {
    const P = V.persona, pausada = P.estado === 'pausada';
    return cabeza('Privacidad y pausa', 'Tú decides cuándo buscar y cuándo no.') + `
      <section class="tarjeta"><h2>${pausada ? 'Tu perfil está en pausa' : 'Pausar mi perfil'}</h2>
        <p class="sub">${pausada ? 'No apareces para nadie y nadie aparece para ti. Al reactivarlo, el motor te vuelve a cruzar y todo regresa como estaba.' : '¿Estás conociendo a alguien? Pausa tu perfil: sales del matching sin borrar nada. Tus puertas abiertas se respetan.'}</p>
        <button class="boton ${pausada ? '' : 'boton-claro'}" id="btn-pausa">${pausada ? 'Reactivar mi perfil' : 'Pausar mi perfil'}</button></section>
      <section class="tarjeta"><h2>Lo que nunca pasa aquí</h2>
        <ul class="razones" style="padding:0">
          <li><span class="i si">✓</span><span>Nadie navega tu perfil. No existe una lista de personas para ver.</span></li>
          <li><span class="i si">✓</span><span>Tus respuestas íntimas solo las lee el motor, nunca una persona.</span></li>
          <li><span class="i si">✓</span><span>Nadie se entera si dijiste que no — ni de que dijiste que sí, hasta que haya dos.</span></li>
          <li><span class="i si">✓</span><span>Lo primero que alguien conoce de ti es tu carta, no tu foto.</span></li>
        </ul></section>
      <section class="tarjeta"><h2>Tu acceso</h2>
        ${DEMO() ? `<p class="sub">Esta es la <b>cuenta demo</b>: datos ficticios que cualquiera puede ver. Para tener tu propio tablero, crea tu cuenta con tu correo.</p><button class="boton" id="crear-cuenta">Crear mi cuenta</button>`
          : `<p class="sub">Sin contraseña. Cada vez que entres te mandamos un enlace a tu correo; vale 20 minutos y se usa una sola vez.</p><div class="acceso-correo"><span>✉️</span><b>${esc(V.sesion.correo || '')}</b></div>`}</section>
      <section class="tarjeta"><h2>Cerrar sesión</h2><p class="sub">Olvida tu sesión en este dispositivo. ${DEMO() ? 'El demo siempre está a un clic en la puerta de entrada.' : 'Para volver, pide un enlace nuevo con tu correo.'}</p>
        <button class="boton boton-oscuro" id="btn-salir">⏻ Cerrar sesión</button></section>`;
  },
};

const DESPUES = {
  charlas() { if (parametro) engancharCharla(parametro); },
  vida() {
    let t = null;
    $$('[data-vida]').forEach((s) => s.oninput = () => {
      const v = vidaActual(); v[s.dataset.vida] = Number(s.value);
      $('#v-' + s.dataset.vida).textContent = s.value + ' %';
      V.vida = v; try { localStorage.setItem('cupido.vida.' + V.persona.id, JSON.stringify(v)); } catch {}
      $('#rueda').innerHTML = ruedaVida(v); $('#lectura-vida').innerHTML = lecturaVida(leerVida(v));
      clearTimeout(t); t = setTimeout(async () => { try { await api('/api/yo/vida', v); } catch (e) { avisar(e.message); } }, 700);
    });
  },
  estilo() {
    TIPOS_UI.forEach(cargarFuente); // para que las muestras se vean con su propia letra
    $$('[data-color]').forEach((b) => b.onclick = async () => { await guardarEstilo({ color: b.dataset.color }); ir('estilo'); });
    $$('[data-tipo]').forEach((b) => b.onclick = async () => { await guardarEstilo({ tipo: b.dataset.tipo }); ir('estilo'); });
  },
  inicio() { const c = $('#crear-cuenta'); if (c) c.onclick = abrirModalCuenta; },
  avisos: marcarLeidos,
  respuestas() { const c = $('#crear-cuenta'); if (c) c.onclick = abrirModalCuenta; },
  medios() {
    const c = $('#crear-cuenta'); if (c) c.onclick = abrirModalCuenta;
    $$('[data-subir]').forEach((i) => i.onchange = () => i.files[0] && subirMedio(i.dataset.subir, i.files[0]));
    $$('[data-borrar]').forEach((b) => b.onclick = async () => { if (!confirm('¿Quitar este archivo?')) return; try { const r = await api2('DELETE', `/api/medio/${b.dataset.borrar}`); V.misMedios = r.medios; ir('medios'); avisar('Listo, se quitó.'); } catch (e) { avisar(e.message); } });
    $$('[data-grabar]').forEach((b) => b.onclick = () => grabar(b.dataset.grabar, b));
  },
  privacidad() {
    $('#btn-salir').onclick = () => $('#salir').click();
    const c = $('#crear-cuenta'); if (c) c.onclick = abrirModalCuenta;
    $('#btn-pausa').onclick = async (e) => {
      e.target.disabled = true;
      const estado = V.persona.estado === 'pausada' ? 'activa' : 'pausada';
      try {
        const r = await api('/api/yo/estado', { estado });
        V = r.vista; avisar(estado === 'pausada' ? 'Perfil en pausa' : 'Perfil reactivado: el motor ya te cruzó'); ir('privacidad');
      } catch (err) { e.target.disabled = false; avisar(err.message); }
    };
  },
};

/* ── la charla: mensajes, "está escribiendo", archivos y liberar el perfil ─ */
const otraDe = (c) => { const [a, b] = c.clave.split('-'); return a === V.persona.id ? b : a; };
let CH = null;
const CH0 = () => ({ otra: null, ultimo: 0, reloj: null, tecleo: 0, datos: null, reac: {}, visto: 0, grabando: null, ws: null, vivo: false, reintento: 0, ping: null, ultimoDe: null, ultimoTs: 0, ultimoDia: null, sinLeer: 0, escribiendoTimer: null, divisor: false, traer: null });
CH = CH0();
window.__cupidoVivo = () => ({ vivo: CH.vivo, otra: CH.otra, ultimo: CH.ultimo, escribiendo: !!CH.escribiendo }); // diagnóstico
function detenerCharla() {

function vidaActual() {

function ruedaVida(v) {
  const N = AREAS_VIDA.length, cx = 150, cy = 150, R = 105;
  const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / N;
  const punto = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const anillos = [25, 50, 75, 100].map((p) => `<polygon class="malla" points="${AREAS_VIDA.map((_, i) => punto(i, (R * p) / 100).map((n) => n.toFixed(1)).join(',')).join(' ')}"/>`).join('');
  const ejes = AREAS_VIDA.map((a, i) => { const [x, y] = punto(i, R); const [lx, ly] = punto(i, R + 22); return `<line class="eje" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${a.i}</text>`; }).join('');
  const forma = AREAS_VIDA.map((a, i) => punto(i, (R * (v[a.id] ?? 50)) / 100).map((n) => n.toFixed(1)).join(',')).join(' ');
  const puntos = AREAS_VIDA.map((a, i) => { const [x, y] = punto(i, (R * (v[a.id] ?? 50)) / 100); return `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"><title>${a.n}: ${v[a.id] ?? 50} %</title></circle>`; }).join('');
  return `<svg class="rueda" viewBox="0 0 300 300" role="img" aria-label="Rueda de mi vida">${anillos}${ejes}<polygon class="forma" points="${forma}"/>${puntos}</svg>`;
}

/* ── medios: subir (la foto se reduce aquí mismo), grabar voz o video ──── */
async function api2(metodo, ruta, cuerpo, tipo) {
  const r = await fetch(ruta, { method: metodo, headers: tipo ? { 'content-type': tipo } : {}, body: cuerpo });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j?.error || 'Algo falló');
  return j;
}
async function reducirFoto(archivo) {
  const bmp = await createImageBitmap(archivo).catch(() => null);
  if (!bmp) return archivo;
  const max = 1400, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob((b) => res(b || archivo), 'image/jpeg', 0.86));
}
async function subirMedio(tipo, archivo) {
  const est = $('#estado-' + tipo); if (est) est.textContent = 'Subiendo…';
  try {
    const cuerpo = tipo === 'foto' ? await reducirFoto(archivo) : archivo;
    const mime = tipo === 'foto' ? 'image/jpeg' : (archivo.type || (tipo === 'audio' ? 'audio/webm' : 'video/webm')).split(';')[0];
    const r = await api2('PUT', `/api/medio/${tipo}`, cuerpo, mime);
    V.misMedios = r.medios; pintarLateral(); ir('medios');
    avisar(tipo === 'foto' ? 'Tu foto quedó guardada.' : tipo === 'audio' ? 'Tu voz quedó guardada.' : 'Tu video quedó guardado.');
  } catch (e) { if (est) est.textContent = ''; avisar(e.message); }
}
let grabadora = null;
async function grabar(tipo, boton) {
  if (grabadora) { grabadora.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { avisar('Tu navegador no puede grabar aquí. Sube un archivo.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia(tipo === 'audio' ? { audio: true } : { audio: true, video: { facingMode: 'user', width: { ideal: 1280 } } }); }
  catch { avisar('No se pudo usar el micrófono o la cámara. Revisa los permisos.'); return; }
  const vista = $('#vista-' + tipo);
  if (tipo === 'video') { vista.innerHTML = '<video autoplay muted playsinline></video>'; vista.querySelector('video').srcObject = stream; }
  else vista.innerHTML = '<div class="medio-vacio grabando"><span style="font-size:34px">🎙️</span><span>Grabando… habla con calma.</span></div>';
  const limite = tipo === 'audio' ? 90 : 45;
  const mime = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm', 'audio/mp4', 'audio/webm'].filter((m) => m.startsWith(tipo)).find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  const partes = []; let seg = 0;
  rec.ondataavailable = (e) => e.data.size && partes.push(e.data);
  const reloj = setInterval(() => { seg++; boton.textContent = `⏹ Detener (${limite - seg} s)`; if (seg >= limite) rec.stop(); }, 1000);
  rec.onstop = () => {
    clearInterval(reloj); stream.getTracks().forEach((t) => t.stop()); grabadora = null;
    const blob = new Blob(partes, { type: rec.mimeType || mime || (tipo === 'audio' ? 'audio/webm' : 'video/webm') });
    subirMedio(tipo, blob);
  };
  grabadora = rec; boton.textContent = `⏹ Detener (${limite} s)`;
  rec.start(1000);
}

  boton.disabled = true;
  try {
    const antes = V.coincidencias.find((c) => c.clave === clave);
    const r = await api('/api/puerta', { otra, decision });
    V = r.vista;
    if (r.estado === 'abierta' && antes?.puerta.estado !== 'abierta') {
      if (seccion === 'coincidencias') ir('coincidencias'); else location.hash = 'coincidencias';
      setTimeout(() => {
        const t = $('#c-' + CSS.escape(clave)); t?.scrollIntoView({ block: 'start' });
        const pu = t?.querySelector('.puerta');
        if (pu && !document.hidden) { pu.classList.remove('abierta'); requestAnimationFrame(() => requestAnimationFrame(() => pu.classList.add('abierta'))); }
      }, 80);
      avisar('💘 Los dos dijeron que sí. Se abrió la puerta.', 4200);
    } else { ir(seccion); avisar(decision === 'si' ? 'Tu sí quedó guardado. Nadie lo verá hasta que haya dos.' : 'Listo. Nadie lo sabrá.'); }
  } catch (e) { boton.disabled = false; avisar(e.message); }
}
</script>
</body>
</html>
