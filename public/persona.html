<script type="module">
// RLR · tablero de la persona
import { $, $$, esc, api, avisar, avatar, anillo, animarAnillos, hace, pronto } from '/js/ui.js';

const _RLR = 'Ricardo López Reyero', _k = 'EYE', _rev = 181218;

/* ── sesión: cookie que puso el Worker (correo con enlace mágico, o demo) ── */
const salirA = (ruta) => location.replace(ruta);
const PRON = { mujer: ['ella', 'la'], hombre: ['él', 'lo'], nobinaria: ['esa persona', 'le'] };

tablero();

/* ═══ TABLERO ════════════════════════════════════════════════════════════ */
let V = null, seccion = 'inicio';
const cont = $('#contenido');

async function tablero() {
  try { V = await api('/api/yo'); }
  catch (e) { if (e.status === 401) salirA('/entrar'); else cont.innerHTML = `<p class="vacio">${esc(e.message)}</p>`; return; }
  // la cuenta demo también pasa por el recorrido la primera vez en este dispositivo (no se puede saltar)
  if (V.sesion.demo) { let b = {}; try { b = JSON.parse(localStorage.getItem('cupido.bienvenida.demo') || '{}'); } catch {} if (!b.hecho) { salirA('/bienvenida'); return; } }
  document.title = `${V.persona.nombreCorto || 'Mi tablero'} · Cupido Algorítmico`;
  V.ajustes = { ...(V.ajustes || {}), ...aplicarEstilo(V.ajustes || (() => { try { return JSON.parse(localStorage.getItem('cupido.estilo') || '{}'); } catch { return {}; } })()) };
  const ds = $('#demo-switch'); ds.hidden = !V.sesion.demo; ds.onclick = abrirModalCuenta;
  ir(location.hash.slice(1) || 'inicio');
  escucharCharlas();
  // la llamada de voz vive encima de todo el tablero: suena y sigue aunque cambies de sección
  montarVoz({ yoId: V.persona.id, api, avisar, quien: (otra) => (V.charlas || []).find((c) => c.otra === otra), alTerminar: (otra) => { if (CH.otra === otra) CH.traer?.(true); } });
  precargar(); // todos los sonidos, decodificados y listos antes de que pase algo
  interruptor($('#son-menu'), 'menu'); interruptor($('#son-movil'), 'icono'); // encender o apagar: un toque, desde cualquier sección
  sonarNovedades();
  reglasUnaVez();
}
const DEMO = () => !!V?.sesion?.demo;
const COIN = () => V.coincidencias.filter((c) => c.puerta.estado !== 'retirada'); // las vivas (una puerta que cerré ya no es coincidencia)
const MANDO = () => !!V?.ella?.mando && !!V?.persona?.genero; // aquí manda ella

/* ── Mi estilo: 4 colores y 4 tipografías ───────────────────────────────── */
const COLORES_UI = [
  { id: 'rosa', n: 'Rosa Cupido', d: 'El original', c: ['#d6455f', '#1c1622', '#fbeef1'] },
  { id: 'vino', n: 'Vino', d: 'Serio y cálido', c: ['#8e2043', '#1f1116', '#f7ecef'] },
  { id: 'azul', n: 'Azul profundo', d: 'Sobrio, como un banco', c: ['#2f55c9', '#121729', '#edf1fc'] },
  { id: 'verde', n: 'Verde bosque', d: 'Tranquilo', c: ['#1f8a7a', '#10201d', '#e9f5f2'] },
];
const TIPOS_UI = [
  { id: 'clasica', n: 'Clásica', d: 'Fraunces + Inter', fam: "'Fraunces', Georgia, serif", link: null },
  { id: 'editorial', n: 'Editorial', d: 'Playfair + Source Sans', fam: "'Playfair Display', Georgia, serif", link: 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap' },
  { id: 'moderna', n: 'Moderna', d: 'Space Grotesk + Inter', fam: "'Space Grotesk', 'Inter', sans-serif", link: 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap' },
  { id: 'calida', n: 'Cálida', d: 'Lora + Nunito', fam: "'Lora', Georgia, serif", link: 'https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap' },
];
function cargarFuente(t) {
  if (!t?.link || document.querySelector(`link[data-fuente="${t.id}"]`)) return;
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = t.link; l.dataset.fuente = t.id; document.head.appendChild(l);
}
function aplicarEstilo(aj = {}) {
  const color = COLORES_UI.some((c) => c.id === aj.color) ? aj.color : 'rosa';
  const tipo = TIPOS_UI.some((t) => t.id === aj.tipo) ? aj.tipo : 'clasica';
  cargarFuente(TIPOS_UI.find((t) => t.id === tipo));
  if (color === 'rosa') delete document.documentElement.dataset.color; else document.documentElement.dataset.color = color;
  if (tipo === 'clasica') delete document.documentElement.dataset.tipo; else document.documentElement.dataset.tipo = tipo;
  try { localStorage.setItem('cupido.estilo', JSON.stringify({ color, tipo })); } catch {}
  return { color, tipo };
}
async function guardarEstilo(cambio) {
  V.ajustes = { ...(V.ajustes || {}), ...aplicarEstilo({ ...(V.ajustes || {}), ...cambio }) };
  try { const r = await api('/api/yo/ajustes', { color: V.ajustes.color, tipo: V.ajustes.tipo }); V.ajustes = r.ajustes; } catch (e) { avisar(e.message); }
}
/* ── el interruptor no se apaga: se cambia por una cuenta propia ─────────── */
function abrirModalCuenta() {
  const pal = $('#demo-switch .pal');
  pal.classList.add('off'); setTimeout(() => pal.classList.remove('off'), 700); // intenta apagarse… y vuelve
  $('#modal-cuenta').classList.add('on'); setTimeout(() => $('#mc-correo')?.focus(), 200);
}
const cerrarModalCuenta = () => $('#modal-cuenta').classList.remove('on');
$('#mc-cerrar').onclick = cerrarModalCuenta; $('#mc-seguir').onclick = cerrarModalCuenta;
$('#modal-cuenta').onclick = (e) => { if (e.target.id === 'modal-cuenta') cerrarModalCuenta(); };
$('#mc-form').onsubmit = async (e) => {
  e.preventDefault();
  const correo = $('#mc-correo').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(correo)) { avisar('Ese correo no se ve bien. Revísalo.'); return; }
  const b = $('#mc-btn'); b.disabled = true; b.textContent = 'Mandando…';
  try {
    const r = await api('/api/entrar', { correo });
    $('#mc-form').hidden = true;
    const l = $('#mc-listo'); l.hidden = false;
    l.innerHTML = `<div class="enviado"><div class="grande">📬</div><h2>Revisa tu correo</h2><p>Te mandamos tu enlace a <b>${esc(r.correo)}</b>. Al abrirlo entras a tu propia cuenta y esta sesión demo se cierra.</p>
      ${r.sinCorreo ? `<p style="font-size:13px;background:var(--ambar-suave);padding:10px;border-radius:10px"><b>Modo desarrollo</b>: <a href="${esc(r.enlace)}">${esc(r.enlace)}</a></p>` : ''}
      <p class="nota-entrar">¿No llega? Revisa el spam. Vale 20 minutos.</p></div>`;
  } catch (err) { avisar(err.message); b.disabled = false; b.textContent = 'Crear mi cuenta →'; }
};

window.addEventListener('hashchange', () => V && ir(location.hash.slice(1)));

/* ── derivados: aceptaciones, logros y camino ────────────────────────────── */
function derivados() {
  const c = COIN(), P = V.persona, r = V.misRespuestas || {};
  const esperanMi = c.filter((x) => x.puerta.estado === 'cerrada' && !x.puerta.miDecision);
  const miSi = c.filter((x) => x.puerta.estado === 'cerrada' && x.puerta.miDecision === 'si');
  const abiertas = c.filter((x) => x.puerta.estado === 'abierta');
  const miNo = c.filter((x) => x.puerta.estado === 'cerrada' && x.puerta.miDecision === 'no');
  const cerradas = V.coincidencias.filter((x) => x.puerta.estado === 'retirada'); // las que yo cerré: puedo volver a abrirlas
  const logros = [
    { m: '📝', t: 'Cuestionario completo', d: 'Las 43 preguntas', ok: P.avance.listo },
    { m: '🔐', t: 'Módulo profundo', d: 'Intimidad y vida interior', ok: !!(r.deseo && r.sx_esperar && (r.practicas || []).length) },
    { m: '✉️', t: 'Carta escrita', d: 'Lo primero que leerá tu match', ok: String(r.carta || '').length > 80 },
    { m: '🔎', t: 'Te conoce bien', d: 'Claridad de 80 % o más', ok: V.claridad.pct >= 80 },
    { m: '💘', t: 'Primera coincidencia', d: `Alguien cruzó el ${V.umbral} %`, ok: c.length > 0 },
    { m: '🌟', t: 'Arriba del 95 %', d: 'Una coincidencia excepcional', ok: c.some((x) => x.pct >= 95) },
    { m: '🤍', t: 'Dijiste que sí', d: 'Te animaste a conocer', ok: miSi.length + abiertas.length > 0 },
    { m: '🔓', t: 'Puerta abierta', d: 'Los dos dijeron que sí', ok: abiertas.length > 0 },
    { m: '📷', t: 'Con rostro y voz', d: 'Foto, voz y video listos', ok: !!(V.misMedios?.foto && V.misMedios?.audio && V.misMedios?.video) },
  ];
  const pasos = [
    { i: '📝', t: 'Responder', d: 'tus 43 preguntas', ok: P.avance.listo },
    { i: '⚙️', t: 'Entrar al matching', d: P.estado === 'pausada' ? 'perfil en pausa' : 'el motor te cruza', ok: P.completo && P.estado === 'activa' },
    { i: '💘', t: 'Coincidencia', d: `alguien arriba del ${V.umbral} %`, ok: c.length > 0 },
    { i: '🤍', t: 'Tu sí', d: 'decides conocer', ok: miSi.length + abiertas.length > 0 },
    { i: '🔓', t: 'Puerta abierta', d: 'se conocen', ok: abiertas.length > 0 },
  ];
  return { esperanMi, miSi, abiertas, miNo, cerradas, logros, pasos, nuevos: V.avisos.filter((a) => !a.leido).length };
}

// A quién le habla el tablero: a ella, de control; a él, de llegar completo; a los demás, sin género
const VIA = () => { const g = V.persona.genero, b = V.misRespuestas?.busca || []; return !g ? 'par' : g === 'hombre' ? (b.includes('mujer') ? 'el' : 'par') : (b.includes('hombre') ? 'ella' : 'par'); };
const TV = (ella, el, par) => { const v = VIA(); return v === 'ella' ? ella : v === 'el' ? el : par; };
// Tu perfil, completo: lo que falta, dicho sin regañar. Desaparece cuando ya está todo.
function perfilCompleto() {
  const P = V.persona, r = V.misRespuestas || {}, m = V.misMedios || {}, listo = !!P.completo, cl = V.claridad?.pct || 0;
  const espera = 'Se abre al terminar tus preguntas';
  const it = [
    { i: '📝', t: 'Tus 43 preguntas', d: listo ? 'Estás en el matching' : `Vas en ${P.avance.pct} %`, ok: listo, a: '/cuestionario', ax: P.avance.pct ? 'Seguir' : 'Empezar' },
    { i: '✉️', t: 'Tu carta', d: 'Lo primero que se lee de ti', si: 'Escrita', ok: String(r.carta || '').trim().length > 80, a: '/cuestionario?p=33', ax: 'Escribirla' },
    { i: '🔎', t: 'Abiertas con ejemplos', d: listo ? (cl >= 80 ? 'El motor te conoce bien' : `El motor te conoce al ${cl} %`) : espera, ok: listo && cl >= 80, a: '#claridad', ax: 'Ver cuáles', cerrado: !listo },
    { i: '📷', t: 'Tu foto', si: TV('Guardada: la enseñas tú cuando quieras', 'Lista para cuando ella abra la puerta', 'Lista'), d: listo ? TV('La enseñas tú, cuando quieras', 'Llega al final, cuando ella abre la puerta', 'Solo la ve quien abra una puerta contigo') : espera, ok: !!m.foto, a: '#medios', ax: 'Subirla', cerrado: !listo },
    { i: '🎙️', t: 'Tu voz', si: 'Lista', d: listo ? 'Un saludo de medio minuto' : espera, ok: !!m.audio, a: '#medios', ax: 'Grabarla', cerrado: !listo },
    { i: '🎬', t: 'Tu video', si: 'Listo', d: listo ? 'Para quien ya llegó hasta ahí' : espera, ok: !!m.video, a: '#medios', ax: 'Subirlo', cerrado: !listo },
  ];
  const hechos = it.filter((x) => x.ok).length;
  if (hechos === it.length) return '';
  return `<section class="tarjeta completo" style="margin-bottom:16px"><div class="completo-cab">${anillo(Math.round(100 * hechos / it.length), 'completo')}<div><h2>${hechos ? `Tu perfil: ${hechos} de ${it.length}` : `Qué gusto${P.nombreCorto ? ', ' + esc(P.nombreCorto) : ''}. Esto es lo que sigue`}</h2>
    <p class="sub">${listo ? '' : TV('Tu filtro se enciende al terminar tus preguntas. ', 'El motor te presenta en cuanto termines tus preguntas. ', 'El motor te cruza en cuanto termines tus preguntas. ')}${TV('Nada de esto se enseña sin que tú lo decidas. Tenerlo listo es llegar al día de la puerta con todo a tu favor.', 'Es lo que ella conoce de ti cuando la puerta se abre. Completo, llegas completo.', 'Entre más completo, mejor te conoce el motor y mejor te conoce quien abra una puerta contigo.')}</p></div></div>
    <div class="completo-lista">${it.map((x) => `<a class="completo-item ${x.ok ? 'ok' : x.cerrado ? 'cerrado' : 'falta'}" ${x.ok || x.cerrado ? '' : `href="${x.a}"`}><span class="ico">${x.i}</span><span class="txt"><b>${x.t}</b><small>${esc(x.ok && x.si ? x.si : x.d)}</small></span><span class="estado">${x.ok ? '✓' : x.cerrado ? '🔒' : x.ax + ' →'}</span></a>`).join('')}</div></section>`;
}

const miAvatar = (P, clase = '') => V.misMedios?.foto ? `<img class="avatar foto ${clase}" src="${esc(V.misMedios.foto.mini || V.misMedios.foto.url)}" alt="">` : avatar(P.nombre === 'Sin nombre' ? '♥' : P.nombre, P.color, clase);
const avatarDe = (r, clase = '') => r.medios?.foto ? `<img class="avatar foto ${clase}" src="${esc(r.medios.foto.mini || r.medios.foto.url)}" alt="${esc(r.nombre)}">` : avatar(r.nombre, r.color, clase);

/* ── menú lateral en el orden del camino ─────────────────────────────────── */
const MENU = [
  { sep: 'Mi búsqueda' },
  { s: 'inicio', i: '🏠', t: 'Inicio' },
  { s: 'coincidencias', i: '💘', t: 'Mis coincidencias', n: () => COIN().length },
  { s: 'aceptaciones', i: '🤝', t: 'Aceptaciones', n: (d) => d.esperanMi.length, alerta: true },
  { s: 'charlas', i: '💬', t: 'Charlas', n: () => (V.charlas || []).reduce((s, c) => s + c.nuevos, 0), alerta: true },
  { s: 'avisos', i: '🔔', t: 'Avisos', n: (d) => d.nuevos, alerta: true },
  { sep: 'Mi perfil' },
  { s: 'pesos', i: '🧭', t: 'Lo que más pesa' },
  { s: 'respuestas', i: '📋', t: 'Mis respuestas' },
  { s: 'vida', i: '🧭', t: 'Mi vida hoy' },
  { s: 'medios', i: '📷', t: 'Foto, voz y video', n: () => (V.persona.completo && !(DEMO() && V.persona.origen === 'demo') ? 3 - Object.keys(V.misMedios || {}).length : 0), alerta: false },
  { s: 'claridad', i: '🔎', t: 'Qué tan bien me conoce' },
  { s: 'filtros', i: '🚧', t: 'Lo que me deja fuera', n: () => V.dejanFuera.length },
  { sep: 'Cuenta' },
  { s: 'ella', i: () => (MANDO() ? '👑' : '🛡️'), t: () => (MANDO() ? 'Aquí mando yo' : 'Las reglas de la casa') },
  { s: 'estilo', i: '🎨', t: 'Mi estilo' },
  { s: 'apoyar', i: '🤍', t: 'Apoyar a Cupido' },
  { s: 'correos', i: '✉️', t: 'Mis correos' },
  { s: 'privacidad', i: '🔒', t: 'Privacidad y pausa' },
];
function pintarLateral() {
  const d = derivados(), P = V.persona;
  $('#quien-lat').innerHTML = `<a href="#medios" class="avatar-enlace" title="Cambiar mi foto">${miAvatar(P)}<span class="lapiz">✎</span></a><div><b>${esc(P.nombre === 'Sin nombre' ? 'Tu cuenta' : P.nombre)}</b><span>${P.edad ? esc(P.edad) + ' · ' : ''}${esc(P.ciudad || '')}</span></div>`;
  // "Volver al recorrido" vive en el menú durante una semana después de terminarlo
  const fechaRec = (() => { if (!DEMO()) return V.ajustes?.bienvenida_fecha; try { return JSON.parse(localStorage.getItem('cupido.bienvenida.demo') || '{}').fecha; } catch { return null; } })();
  const recorrido = fechaRec && (Date.now() - Date.parse(fechaRec)) < 7 * 86400000 ? `<a href="/bienvenida?repaso=1" class="recorrido"><span class="ico">🧭</span>Volver al recorrido<span class="cuenta-nav gris">7 días</span></a>` : '';
  $('#nav').innerHTML = recorrido + MENU.map((m) => {
    if (m.sep) return `<div class="sep">${m.sep}</div>`;
    const n = m.n ? m.n(d) : 0;
    const val = (x) => (typeof x === 'function' ? x() : x);
    return `<a href="#${m.s}" data-s="${m.s}" class="${m.s === seccion ? 'on' : ''}"><span class="ico">${val(m.i)}</span>${val(m.t)}${n ? `<span class="cuenta-nav ${m.alerta ? '' : 'gris'}">${n}</span>` : ''}</a>`;
  }).join('');
  $('#pie-lat').innerHTML = DEMO() ? 'Demo con datos ficticios.<br><a href="/admin">Ver el panel admin →</a>' : `Sin contraseña: entras con tu correo.${V.sesion.correo ? `<br><span style="word-break:break-all">${esc(V.sesion.correo)}</span>` : ''}`;

let parametro = null;
function ir(s) {
  const [base, ...resto] = String(s || '').split('/');
  parametro = resto.length ? resto.join('/') : null;
  s = base;
  seccion = SECCIONES[s] ? s : 'inicio';
  if (s !== 'charlas') detenerCharla();
  cerrarMenu();
  pintarLateral();
  cont.innerHTML = `<div class="seccion-admin">${SECCIONES[seccion]()}</div>`;
  window.scrollTo(0, 0);
  pronto(() => { $$('.relleno[data-w]').forEach((b) => b.style.width = b.dataset.w + '%'); animarAnillos(cont); });
  $$('[data-decision]').forEach((b) => b.onclick = () => decidir(b.dataset.clave, b.dataset.decision, b));
  (DESPUES[seccion] || (() => {}))();
}

const ESCUCHA = new Map();
function escucharCharlas() {
  if (!('WebSocket' in window)) return;
  for (const c of V.charlas || []) {
    if (ESCUCHA.has(c.otra)) continue;
    const abrir = () => {
      let ws; try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/charla/${encodeURIComponent(c.otra)}/ws`); } catch { return; }
      ESCUCHA.set(c.otra, ws);
      ws.onmessage = (e) => {
        let ev; try { ev = JSON.parse(e.data); } catch { return; }
        if (ev.t === 'llamada') { vozEvento(c.otra, ev); return; } // una llamada suena en todo el tablero, no solo dentro de su charla
        if (ev.t === 'cerrada') { ws.onclose = null; ESCUCHA.delete(c.otra); if (!(CH.otra === c.otra && seccion === 'charlas')) refrescarVista(); return; }
        if (ev.t !== 'mensaje' || ev.de === V.persona.id || ev.de === 'sistema') return;
        if (ev.tipo === 'llamada' && !/sin contestar/.test(ev.vista || '')) return; // una llamada que sí se habló no es una novedad sin leer
        if (CH.otra === c.otra && seccion === 'charlas') return; // esa charla ya está abierta: ella se encarga
        const mia = (V.charlas || []).find((x) => x.otra === c.otra); if (mia) { mia.nuevos = (mia.nuevos || 0) + 1; mia.ultimo = { texto: ev.vista, mio: false, creado: new Date().toISOString() }; pintarLateral(); }
        sonMensaje(); toastMensaje(c, ev.vista || 'Mensaje nuevo');
        if (document.hidden) avisarFuera(c.nombre, ev.vista || 'Mensaje nuevo');
      };
      ws.onclose = () => { ESCUCHA.delete(c.otra); setTimeout(() => { if (!ESCUCHA.has(c.otra)) abrir(); }, 8000); };
    };
    abrir();
  }
}

// Al abrir el tablero: si hay una coincidencia nueva sin leer, suena una vez; si ganaste un logro desde la última vez, también
function sonarNovedades() {
  try {
    const k = 'cupido.novedades.' + V.persona.id, prev = JSON.parse(localStorage.getItem(k) || '{}');
    const nuevos = V.avisos.filter((a) => !a.leido && a.tipo === 'coincidencia').map((a) => a.id);
    const apert = V.avisos.filter((a) => !a.leido && a.tipo === 'apertura').map((a) => a.id);
    const otros = V.avisos.filter((a) => !a.leido && !['coincidencia', 'apertura'].includes(a.tipo)).map((a) => a.id);
    const d = derivados(), ganados = d.logros.filter((l) => l.ok).length;
    setTimeout(() => {
      if (apert.some((id) => !(prev.avisos || []).includes(id))) tocar('puerta');
      else if (nuevos.some((id) => !(prev.avisos || []).includes(id))) tocar('coincidencia');
      else if (prev.logros != null && ganados > prev.logros) tocar('logro');
      else if (otros.some((id) => !(prev.avisos || []).includes(id))) tocar('aviso');
    }, 900);
    localStorage.setItem(k, JSON.stringify({ avisos: [...nuevos, ...apert, ...otros], logros: ganados }));
  } catch {}
}

/* ── mi vida hoy: valores, rueda y lectura ───────────────────────────────── */
function vidaActual() {

    const base = { pareja: 35, familia: 80, hijos: 50, amigos: 70, trabajo: 75, dinero: 60, salud: 65, espiritu: 70, diversion: 55, legado: 45 };
    let h = 0; for (const c of V.persona.id) h = (h * 31 + c.charCodeAt(0)) % 97;
    return Object.fromEntries(AREAS_VIDA.map((a, i) => [a.id, Math.max(10, Math.min(95, base[a.id] + (((h + i * 13) % 5) - 2) * 5))]));

function ruedaVida(v) {
  const N = AREAS_VIDA.length, cx = 150, cy = 150, R = 105;
  const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / N;
  const punto = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const anillos = [25, 50, 75, 100].map((p) => `<polygon class="malla" points="${AREAS_VIDA.map((_, i) => punto(i, (R * p) / 100).map((n) => n.toFixed(1)).join(',')).join(' ')}"/>`).join('');
  const ejes = AREAS_VIDA.map((a, i) => { const [x, y] = punto(i, R); const [lx, ly] = punto(i, R + 22); return `<line class="eje" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${a.i}</text>`; }).join('');
  const forma = AREAS_VIDA.map((a, i) => punto(i, (R * (v[a.id] ?? 50)) / 100).map((n) => n.toFixed(1)).join(',')).join(' ');
  const puntos = AREAS_VIDA.map((a, i) => { const [x, y] = punto(i, (R * (v[a.id] ?? 50)) / 100); return `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"><title>${a.n}: ${v[a.id] ?? 50} %</title></circle>`; }).join('');
  return `<svg class="rueda" viewBox="0 0 300 300" role="img" aria-label="Rueda de mi vida">${anillos}${ejes}<polygon class="forma" points="${forma}"/>${puntos}</svg>`;
}
function lecturaVida(L) {

// Foto a resolución completa (y su miniatura para el avatar); voz y video tal cual, sin volver a comprimirse
async function subirMedio(tipo, archivo) {
  const est = $('#estado-' + tipo), decir = (t) => { const e = $('#estado-' + tipo); if (e) e.textContent = t; };
  decir('Preparando…');
  try {
    let cuerpo = archivo, mime = tipoDe(archivo) || (tipo === 'audio' ? 'audio/webm' : tipo === 'video' ? 'video/webm' : 'image/jpeg'), extra = {};
    if (tipo === 'foto') { const f = await prepararFoto(archivo, { vistaMax: 480 }); cuerpo = f.cuerpo; mime = f.mime; extra = { vista: f.vista, ancho: f.ancho, alto: f.alto }; }

    const r = await subirPorPartes({ destino: 'medio', tipo }, cuerpo, { mime, ...extra, alProgreso: (p) => decir(`Subiendo… ${Math.round(p * 100)} % de ${legible(cuerpo.size)}`) });

  } catch (e) { decir(''); avisar(e.message, 5000); }

let grabando = null;
async function grabar(tipo, boton) {
  if (grabando) { grabando.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { avisar('Tu navegador no puede grabar aquí. Sube un archivo.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia(tipo === 'audio' ? { audio: MICROFONO } : { audio: MICROFONO, video: CAMARA }); }
  catch { try { stream = await navigator.mediaDevices.getUserMedia(tipo === 'audio' ? { audio: true } : { audio: true, video: { facingMode: 'user' } }); } catch { avisar('No se pudo usar el micrófono o la cámara. Revisa los permisos.'); return; } }
  const vista = $('#vista-' + tipo);
  if (tipo === 'video') { vista.innerHTML = '<video autoplay muted playsinline></video>'; vista.querySelector('video').srcObject = stream; }
  else vista.innerHTML = '<div class="medio-vacio grabando"><span style="font-size:34px">🎙️</span><span>Grabando… habla con calma.</span></div>';
  const limite = tipo === 'audio' ? 90 : 45;
  const rec = grabadora(stream, tipo), mime = rec.mimeType; // voz a 256 kbps; video a 1080p y 8 Mbps
  const partes = []; let seg = 0;
  rec.ondataavailable = (e) => e.data.size && partes.push(e.data);
  const reloj = setInterval(() => { seg++; boton.textContent = `⏹ Detener (${limite - seg} s)`; if (seg >= limite) rec.stop(); }, 1000);
  rec.onstop = () => {
    clearInterval(reloj); stream.getTracks().forEach((t) => t.stop()); grabando = null; callar(false);
    const blob = new Blob(partes, { type: rec.mimeType || mime || (tipo === 'audio' ? 'audio/webm' : 'video/webm') });
    subirMedio(tipo, blob);
  };
  grabando = rec; boton.textContent = `⏹ Detener (${limite} s)`;
  callar(true); // mientras grabas tu voz o tu video, los efectos de Cupido no suenan: no deben quedar grabados
  rec.start(1000);
}

  const L = V.ella?.limites || { veto: 10, insistencia: 5 }, hombre = V.persona.genero === 'hombre', mando = MANDO();
  const velo = document.createElement('div'); velo.className = 'modal-velo on';
  velo.innerHTML = `<div class="modal claro" role="dialog"><p class="eyebrow" style="margin:0 0 6px">Las reglas de la casa</p>
    <h2>${mando ? 'Algo nuevo: aquí mandas tú.' : 'Aquí manda ella.'}</h2>
    <p class="sub">${mando ? 'Cupido está hecho para que tú encuentres a la persona correcta: segura, cómoda y en control. Desde hoy, así funciona por dentro.' : 'Cupido está hecho para que ella encuentre a la persona correcta, segura y en control. Un lugar así es el único donde una mujer seria contesta en serio.'}</p>
    <ol class="regla"><li><b>Si ${mando ? 'tú bloqueas' : 'ella bloquea'}, queda bloqueado.</b></li><li><b>Si ${L.veto} mujeres distintas bloquean al mismo hombre, queda fuera para siempre.</b></li><li><b>${mando ? 'Puedes' : 'Ella puede'} decir que sí y después dejar de decirlo.</b></li></ol>
    ${hombre ? `<p class="sub" style="margin-top:10px">También: no mandas fotos ni archivos hasta que ella lo permite, y después de ${L.insistencia} mensajes sin respuesta te toca esperar. Que una charla no funcione no es un bloqueo: cualquiera de los dos puede cerrar la puerta sin castigo.</p>` : ''}
    <div class="acciones" style="margin-top:14px"><button class="boton" id="rg-ok">${hombre ? 'Acepto las reglas' : mando ? 'Ver todo lo que yo decido' : 'Entendido'}</button>${hombre ? '<button class="boton boton-fantasma" id="rg-salir">Cerrar sesión</button>' : '<button class="boton boton-fantasma" id="rg-luego">Entendido</button>'}</div></div>`;
  document.body.appendChild(velo);
  const aceptar = async (ira) => { try { const r = await api('/api/yo/ajustes', { reglas: true }); V.ajustes = { ...V.ajustes, ...r.ajustes }; V.ella.reglas = r.ajustes.reglas; } catch {} velo.remove(); if (ira) location.hash = 'ella'; };
  $('#rg-ok', velo).onclick = () => aceptar(!hombre && mando);
  const l = $('#rg-luego', velo); if (l) l.onclick = () => aceptar(false);
  const sx = $('#rg-salir', velo); if (sx) sx.onclick = () => $('#salir').click();
}

/* ── piezas ──────────────────────────────────────────────────────────────── */
const filaAviso = (a) => `<div class="aviso ${a.leido ? '' : 'nuevo'}"><span>${a.tipo === 'apertura' ? '🔓' : a.tipo === 'cierre' ? '🚪' : '💘'}</span><div>${esc(a.texto)}<span class="cuando">${hace(a.creado)}</span></div></div>`;
async function marcarLeidos() {
  if (!V.avisos.some((a) => !a.leido)) return;
  try { await api('/api/avisos/leer', {}); V.avisos.forEach((a) => a.leido = 1); pintarLateral(); } catch {}
}
function silencio() {
  return `<section class="tarjeta silencio"><div class="grande">🌙</div><h3>Todavía nadie cruza el ${V.umbral} % contigo</h3>
    <p>El silencio también es parte del servicio: te estamos ahorrando años con las personas incorrectas. En cuanto alguien lo supere, te avisamos a ti y a esa persona al mismo tiempo.</p>
    ${V.masCerca ? `<div class="cerca">🧭 Lo más cerca que alguien ha estado de ti: <b>${V.masCerca} %</b></div>` : ''}</section>`;
}

function tarjetaCoincidencia(c) {
  const [pr, lo] = PRON[c.genero] || PRON.nobinaria;
  const abierta = c.puerta.estado === 'abierta', mia = c.puerta.miDecision;
  const puertaHtml = (clase, titulo, texto) => `<div class="puerta-fila"><div class="puerta ${clase}"><div class="marco"></div><div class="luz"></div><div class="hoja"></div><span class="candado">🔒</span></div><div class="puerta-texto"><b>${titulo}</b>${texto}</div></div>`;
  let puerta;
  if (abierta) puerta = puertaHtml('abierta', 'Se abrió la puerta', `Los dos dijeron que sí. Esto es lo que ${pr} quiso que conocieras primero.`);
  else if (mia === 'si') puerta = puertaHtml('', 'Tu sí está guardado 🤍', `Si ${pr} también dice que sí, la puerta se abre para los dos al mismo tiempo.`) + `<div class="puerta-acciones"><button class="enlace" data-clave="${esc(c.clave)}" data-decision="no">Cambiar de opinión</button></div>`;
  else if (mia === 'no') puerta = puertaHtml('', 'Elegiste no abrir esta puerta', 'Nadie lo sabrá. Puedes reconsiderarlo mientras la coincidencia exista.') + `<div class="puerta-acciones"><button class="boton boton-claro boton-chico" data-clave="${esc(c.clave)}" data-decision="si">Reconsiderar: sí quiero</button></div>`;
  else puerta = puertaHtml('', 'La puerta está cerrada', 'Te avisamos porque vale la pena. Pero no se abre hasta que los dos digan que sí — y nadie se entera si el otro dijo que no.') +
    `<div class="puerta-acciones"><button class="boton" data-clave="${esc(c.clave)}" data-decision="si">Sí, quiero conocer${lo}</button><button class="boton boton-fantasma" data-clave="${esc(c.clave)}" data-decision="no">Ahora no</button></div>`;
  const r = c.revelado;
  return `<article class="tarjeta coincidencia" id="c-${esc(c.clave)}">
    <div class="coin-cabeza">${anillo(c.pct)}<div class="coin-titulo"><h3>${abierta ? esc(r.nombre) : `Alguien al ${c.pct} % contigo`}</h3>
      <div class="meta">${abierta ? `${esc(r.edad)} · ${esc(r.ciudad)}` : `Aviso ${c.puerta.avisada ? hace(c.puerta.avisada) : 'reciente'} · identidad protegida`}</div></div></div>
    <ul class="razones">
      ${c.fuertes.map((f) => `<li><span class="i si">✓</span><span><small>${esc(f.dim)}</small>${esc(f.txt)}</span></li>`).join('')}
      ${c.cuidar ? `<li><span class="i ojo">~</span><span><small>Lo que tendrían que cuidar · ${esc(c.cuidar.dim)}</small>${esc(c.cuidar.txt)}</span></li>` : ''}
    </ul>
    ${c.senales ? `<div class="senales"><b>👑 Lo que solo tú ves de él</b><span>${c.senales.dias < 1 ? 'Llegó hoy' : `Lleva ${c.senales.dias} ${c.senales.dias === 1 ? 'día' : 'días'} aquí`}</span><span>${c.senales.charlas ? `Conversa con ${c.senales.charlas} ${c.senales.charlas === 1 ? 'persona' : 'personas'} más` : 'No conversa con nadie más'}</span><span class="${c.senales.bloqueos ? 'ojo' : 'bien'}">${c.senales.bloqueos ? `${c.senales.bloqueos} ${c.senales.bloqueos === 1 ? 'mujer lo ha bloqueado' : 'mujeres lo han bloqueado'}` : 'Ninguna mujer lo ha bloqueado'}</span></div>` : ''}
    <div class="puerta-zona">${puerta}${c.demoId ? `<a class="demo-herramienta" href="/persona?id=${esc(c.demoId)}">👁 Herramienta de demo: entrar al tablero de esa persona</a>` : ''}</div>
    ${abierta ? `<div class="revelado">
      <div class="quien">${avatarDe(r, 'xl')}<div><h3>${esc(r.nombreCompleto)}</h3><div class="meta" style="color:var(--gris)">${esc(r.edad)} · ${esc(r.ciudad)}</div></div></div>
      ${r.carta ? `<div class="carta">${esc(r.carta)}</div>` : ''}
      ${r.malinterpretan ? `<p class="entender"><b>Lo que le gustaría que entendieras desde el día uno:</b> ${esc(r.malinterpretan)}</p>` : ''}
      <p style="margin:14px 0 0"><a class="boton" href="#charlas/${esc(otraDe(c))}">💬 Abrir la charla</a></p>
      <div class="revelado-medios">
        ${r.medios?.audio ? `<div class="rm"><b>🎙️ Su voz</b><audio controls preload="metadata" src="${esc(r.medios.audio.url)}"></audio></div>` : ''}
        ${r.medios?.video ? `<div class="rm"><b>🎬 Su video</b><video controls playsinline preload="${r.medios.video.mini ? 'none' : 'metadata'}" ${r.medios.video.mini ? `poster="${esc(r.medios.video.mini)}"` : ''} src="${esc(r.medios.video.url)}"></video></div>` : ''}
        ${r.medios?.foto ? `<div class="rm"><b>📷 Su foto</b><img src="${esc(r.medios.foto.url)}" alt="${esc(r.nombre)}"></div>` : ''}
      </div>
      ${!(r.medios?.foto || r.medios?.audio || r.medios?.video) ? `<div class="proximos"><div><span>🎙️</span>Su voz</div><div><span>🎬</span>Su video</div><div><span>📷</span>Su foto</div></div><p class="seccion-sub" style="margin:12px 0 0">${c.mediosGuardados ? `${esc(r.nombre)} decide cuándo enseñarte su foto, su voz y su video. Abrir la puerta no los entrega.` : `${esc(r.nombre)} todavía no ha subido foto, voz ni video. Aparecerán aquí en cuanto lo haga.`}</p>` : ''}</div>` : ''}
  </article>`;
}

async function decidir(clave, decision, boton) {
  const [a, b] = clave.split('-');
  const otra = a === V.persona.id ? b : a;
  boton.disabled = true;
  try {
    const antes = V.coincidencias.find((c) => c.clave === clave);
    const r = await api('/api/puerta', { otra, decision });
    ponerVista(r.vista);
    if (r.estado === 'abierta' && antes?.puerta.estado !== 'abierta') {
      if (seccion === 'coincidencias') ir('coincidencias'); else location.hash = 'coincidencias';
      setTimeout(() => {
        const t = $('#c-' + CSS.escape(clave)); t?.scrollIntoView({ block: 'start' });
        const pu = t?.querySelector('.puerta');
        if (pu && !document.hidden) { pu.classList.remove('abierta'); requestAnimationFrame(() => requestAnimationFrame(() => pu.classList.add('abierta'))); }
      }, 80);
      tocar('puerta'); avisar('💘 Los dos dijeron que sí. Se abrió la puerta.', 4200);
    } else { ir(seccion); tocar(decision === 'si' ? 'si' : 'guardado'); avisar(decision === 'si' ? 'Tu sí quedó guardado. Nadie lo verá hasta que haya dos.' : 'Listo. Nadie lo sabrá.'); }
  } catch (e) { boton.disabled = false; avisar(e.message); }
}
