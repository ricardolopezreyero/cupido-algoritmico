<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de personas · Cupido Algorítmico</title>
<meta name="description" content="Tus coincidencias arriba del 90 %, la puerta que solo se abre si los dos dicen que sí, y lo que el algoritmo sabe de ti.">
<meta name="author" content="Ricardo López Reyero">
<meta name="rev" content="181218">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/cupido.css">
</head>
<body data-author="RLR">
<!-- Cupido Algorítmico · Panel de personas · RLR · Ricardo López Reyero -->
<header class="barra"><div class="envoltura barra-in">
  <a class="marca" href="/"><span class="corazon">💘</span><b>Cupido Algorítmico</b></a>
  <span class="pildora-demo">DEMO</span>
  <nav class="menu"><a href="/persona" class="activo">Personas</a><a href="/articulos">Artículos</a><a href="/admin">Admin</a></nav>
</div></header>

<main id="app" class="envoltura persona-main"><p class="vacio" style="padding:40px 0;text-align:center">Cargando…</p></main>

<script type="module">
// RLR · panel de la persona
import { $, $$, esc, api, avisar, avatar, anillo, animarAnillos, hace, pronto } from '/js/ui.js';
const _RLR = 'Ricardo López Reyero', _rev = 181218;
const app = $('#app');
const q = new URLSearchParams(location.search);
const id = q.get('id'), token = q.get('t');
const PRON = { mujer: ['ella', 'a'], hombre: ['él', 'o'], nobinaria: ['esa persona', 'e'] };

if (!id && !token) selector(); else panel();

/* ── Selector: entra como cualquiera de las 20 personas del demo ─────────── */
async function selector() {
  const pool = await api('/api/pool');
  const guardado = (() => { try { return localStorage.getItem('cupido.segmento'); } catch { return null; } })();
  let seg = guardado || 'mujer';
  const pintar = () => {
    const lista = pool.filter((p) => (seg === 'cuestionario' ? p.origen === 'cuestionario' : p.origen === 'demo' && p.genero === seg));
    $('#rejilla').innerHTML = lista.map((p) => `
      <a class="ficha" href="/persona?id=${esc(p.id)}">
        ${avatar(p.nombre, p.color)}
        <div><b>${esc(p.nombre)}</b><span class="meta">${p.edad ? esc(p.edad) + ' · ' : ''}${esc(ciudad(p.ciudad))}${p.completo ? '' : ' · sin terminar'}</span>
        ${p.bio ? `<p>${esc(p.bio)}</p>` : ''}</div>
        ${p.avisos ? `<span class="badge">${p.avisos} ${p.avisos === 1 ? 'aviso' : 'avisos'}</span>` : ''}
      </a>`).join('') || '<p class="vacio">Aún nadie ha llenado el cuestionario conectado. <a href="/cuestionario">Sé el primero</a>.</p>';
    $$('.segmento button').forEach((b) => b.classList.toggle('on', b.dataset.s === seg));
  };
  const hayCuest = pool.some((p) => p.origen === 'cuestionario');
  app.innerHTML = `
    <section class="selector-hero">
      <p class="eyebrow">Panel de personas</p>
      <h1>Entra como cualquiera de las 20 personas</h1>
      <p class="lead">Son ficticias, pero respondieron las 41 preguntas completas. Elige a alguien y mira lo que el algoritmo encontró para esa persona.</p>
      <div class="segmento" role="tablist">
        <button data-s="mujer">Mujeres</button><button data-s="hombre">Hombres</button>${hayCuest ? '<button data-s="cuestionario">Del cuestionario</button>' : ''}
      </div>
    </section>
    <section id="rejilla" class="rejilla-personas"></section>
    <p class="nota-privada">🔑 <span>En la versión real no hay contraseñas: cada persona entra con su propio enlace privado (y, si cambia de dispositivo, con un enlace mágico a su correo).</span></p>`;
  $$('.segmento button').forEach((b) => b.onclick = () => { seg = b.dataset.s; try { localStorage.setItem('cupido.segmento', seg); } catch {} pintar(); });
  pintar();
}

const CIUDADES = { cdmx: 'Ciudad de México', monterrey: 'Monterrey', guadalajara: 'Guadalajara', puebla: 'Puebla', queretaro: 'Querétaro', torreon: 'Torreón', saltillo: 'Saltillo', merida: 'Mérida', leon: 'León', tijuana: 'Tijuana', chihuahua: 'Chihuahua', cancun: 'Cancún', sanluis: 'San Luis Potosí', aguascalientes: 'Aguascalientes', morelia: 'Morelia', hermosillo: 'Hermosillo', oaxaca: 'Oaxaca', veracruz: 'Veracruz', otra: 'Otra ciudad' };
const ciudad = (c) => CIUDADES[c] || c || '';

/* ── Panel de la persona ─────────────────────────────────────────────────── */
let vista = null;
async function panel() {
  try { vista = await api(token ? `/api/yo/${encodeURIComponent(token)}` : `/api/persona/${encodeURIComponent(id)}`); }
  catch (e) { app.innerHTML = `<div class="tarjeta silencio"><div class="grande">🔍</div><h3>No encontramos este panel</h3><p>${esc(e.message)}</p><a class="boton" href="/persona">Ver personas del demo</a></div>`; return; }
  pintarPanel();
}

function pintarPanel() {
  const v = vista, P = v.persona;
  document.title = `${P.nombreCorto} · Cupido Algorítmico`;
  const nuevos = v.avisos.filter((a) => !a.leido).length;
  const mensajeEstado = !P.completo ? 'Tu perfil aún no entra al matching: faltan respuestas.' : P.estado === 'pausada' ? 'Tu perfil está en pausa: no apareces para nadie.' : 'Tu perfil está completo y dentro del matching.';
  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <a class="volver" style="margin:0" href="/persona">← Cambiar de persona</a>
      <button class="boton boton-claro boton-chico campana" id="btn-avisos">🔔 Avisos${nuevos ? `<span class="n">${nuevos}</span>` : ''}</button>
    </div>
    <section class="tarjeta">
      <div class="saludo">${avatar(P.nombre, P.color, 'xl')}
        <div><h1>Hola, ${esc(P.nombreCorto)}.</h1><div class="meta">${P.edad ? esc(P.edad) + ' · ' : ''}${esc(P.ciudad || '')}</div>
        <div style="margin-top:6px"><span class="chip ${P.completo && P.estado === 'activa' ? 'ok' : 'ambar'}">${esc(mensajeEstado)}</span></div></div>
      </div>
      <div class="estado-pool">
        <div><b>${v.pool.delOtroLado}</b><span>personas del otro lado</span></div>
        <div><b>${v.pool.compatibles}</b><span>pasan los filtros de los dos</span></div>
        <div><b>${v.coincidencias.length}</b><span>arriba del ${v.umbral} %</span></div>
      </div>
      <div id="avisos" class="avisos-lista" hidden></div>
    </section>

    <div class="seccion-t"><h2>Tus coincidencias</h2><span class="chip gris">Solo de ${v.umbral} % hacia arriba</span></div>
    <p class="seccion-sub">Nadie ve tu perfil. Cuando alguien cruza el ${v.umbral} % te avisamos a ti y a esa persona al mismo tiempo — pero la puerta no se abre hasta que los dos digan que sí.</p>
    <div id="coincidencias">${v.coincidencias.length ? v.coincidencias.map(tarjetaCoincidencia).join('') : silencio(v)}</div>

    <div class="seccion-t"><h2>Mientras tanto</h2></div>
    <p class="seccion-sub">Lo que el algoritmo sabe de ti — para que entiendas cómo te busca.</p>
    <section class="tarjeta">
      <h3 style="margin:0 0 4px;font-size:20px">Lo que más pesa en tu lado del cálculo</h3>
      <p class="seccion-sub" style="margin-bottom:8px">No te preguntamos qué te importa: lo deducimos de lo que haces. Lo morado subió por tus propias respuestas.</p>
      <div class="barras">${v.pesos.map((w) => `
        <div class="barra-fila"><span>${esc(w.dim)}</span><div class="pista"><div class="relleno ${w.por ? 'sube' : ''}" data-w="${Math.min(100, w.pct * 4)}"></div></div><b>${w.pct} %</b>
        ${w.por ? `<span class="por">↑ ${esc(w.por)}</span>` : ''}</div>`).join('')}</div>
    </section>
    <section class="tarjeta">
      <h3 style="margin:0 0 4px;font-size:20px">Qué tan bien te conoce el algoritmo</h3>
      <div class="barra-fila" style="grid-template-columns:1fr 50px;margin-top:10px"><div class="pista"><div class="relleno" data-w="${v.claridad.pct}"></div></div><b>${v.claridad.pct} %</b></div>
      <p style="margin:10px 0 0;color:var(--tinta-2);font-size:15px">${v.claridad.flojas.length
        ? `Tus coincidencias serían más certeras si le cuentas más en las preguntas ${[...new Set(v.claridad.flojas.flatMap((f) => f.preguntas))].sort((a, b) => a - b).join(', ')}. No se trata de escribir bonito: se trata de escribir verdad, con ejemplos.`
        : 'Te describiste con claridad y con ejemplos reales. Eso hace que tus coincidencias sean de verdad tuyas.'}</p>
      ${token ? `<a class="boton boton-claro boton-chico" style="margin-top:12px" href="/cuestionario?t=${encodeURIComponent(token)}">Editar mis respuestas</a>` : ''}
    </section>
    <section class="tarjeta">
      <h3 style="margin:0 0 4px;font-size:20px">Lo que te está dejando fuera</h3>
      ${v.dejanFuera.length ? `<ul class="razones" style="padding:0">${v.dejanFuera.map((d) => `<li><span class="i ojo">!</span><span>${textoDejaFuera(d)}</span></li>`).join('')}</ul>
        <p class="seccion-sub" style="margin:12px 0 0">Solo te lo decimos de filtros que tú podrías reconsiderar. Nunca te sugeriremos negociar hijos, fe, exclusividad ni tus límites íntimos.</p>`
      : `<p style="margin:6px 0 0;color:var(--tinta-2)">Tus filtros no están dejando fuera a nadie con quien tendrías una compatibilidad alta. 👌</p>`}
    </section>
    ${token ? `<section class="tarjeta"><h3 style="margin:0 0 4px;font-size:20px">Tu enlace privado</h3><p class="seccion-sub" style="margin:0">Es tu llave: guárdalo. No hay contraseña.</p>
      <div class="enlace-privado"><input id="mi-enlace" readonly value="${esc(location.origin + '/persona?t=' + token)}"><button class="boton boton-chico" id="copiar">Copiar</button></div></section>` : ''}
    <p class="nota-privada">🔒 <span>Tus respuestas íntimas solo las lee el algoritmo. Si algún día hay puerta abierta, lo primero que la otra persona conoce de ti es tu carta — no tu foto.</span></p>`;

  pronto(() => { $$('.relleno[data-w]').forEach((b) => b.style.width = b.dataset.w + '%'); animarAnillos(app); });
  $('#btn-avisos').onclick = abrirAvisos;
  $$('[data-decision]').forEach((b) => b.onclick = () => decidir(b.dataset.otra, b.dataset.decision, b));
  const c = $('#copiar'); if (c) c.onclick = async () => { try { await navigator.clipboard.writeText($('#mi-enlace').value); avisar('Enlace copiado'); } catch { $('#mi-enlace').select(); } };
}

function silencio(v) {
  return `<section class="tarjeta silencio">
    <div class="grande">🌙</div>
    <h3>Todavía nadie cruza el ${v.umbral} % contigo</h3>
    <p>El silencio también es parte del servicio: te estamos ahorrando años con las personas incorrectas. En cuanto alguien lo supere, te avisamos a ti y a esa persona al mismo tiempo.</p>
    ${v.masCerca ? `<div class="cerca">🧭 Lo más cerca que alguien ha estado de ti: <b>${v.masCerca} %</b></div>` : ''}
  </section>`;
}

function textoDejaFuera(d) {
  const que = { edad: 'Tu rango de edad', distancia: 'Que ni tú ni la otra persona se moverían de ciudad', alcohol: 'Tu filtro de alcohol', tabaco: 'Tu filtro de tabaco', mascotas: 'Tu filtro de mascotas' }[d.id] || 'Uno de tus filtros';
  return `${que} deja fuera a <b>${d.personas}</b> ${d.personas === 1 ? 'persona' : 'personas'} con quien tendrías hasta <b>${d.mejor} %</b>${d.mejor >= vista.umbral ? ' — arriba del umbral' : ''}.`;
}

function tarjetaCoincidencia(c) {
  const [pr, o] = PRON[c.genero] || PRON.nobinaria;
  const abierta = c.puerta.estado === 'abierta';
  const mia = c.puerta.miDecision;
  let puerta;
  if (abierta) {
    puerta = `<div class="puerta-fila"><div class="puerta abierta"><div class="marco"></div><div class="luz"></div><div class="hoja"></div><span class="candado">🔒</span></div>
      <div class="puerta-texto"><b>Se abrió la puerta</b>Los dos dijeron que sí. Ahora sí: esto es lo que ${pr} quiso que conocieras primero.</div></div>`;
  } else if (mia === 'si') {
    puerta = `<div class="puerta-fila"><div class="puerta"><div class="marco"></div><div class="luz"></div><div class="hoja"></div><span class="candado">🔒</span></div>
      <div class="puerta-texto"><b>Tu sí está guardado 🤍</b>Si ${pr} también dice que sí, la puerta se abre para los dos al mismo tiempo. Si no, nunca sabrás por qué — y ${pr} tampoco sabrá lo tuyo.</div></div>
      <div class="puerta-acciones"><button class="enlace" data-otra="${esc(c.clave)}" data-decision="no">Cambiar de opinión</button></div>`;
  } else if (mia === 'no') {
    puerta = `<div class="puerta-fila"><div class="puerta"><div class="marco"></div><div class="luz"></div><div class="hoja"></div><span class="candado">🔒</span></div>
      <div class="puerta-texto"><b>Elegiste no abrir esta puerta</b>Nadie lo sabrá. Puedes reconsiderarlo mientras la coincidencia exista.</div></div>
      <div class="puerta-acciones"><button class="boton boton-claro boton-chico" data-otra="${esc(c.clave)}" data-decision="si">Reconsiderar: sí quiero</button></div>`;
  } else {
    puerta = `<div class="puerta-fila"><div class="puerta"><div class="marco"></div><div class="luz"></div><div class="hoja"></div><span class="candado">🔒</span></div>
      <div class="puerta-texto"><b>La puerta está cerrada</b>Te avisamos porque vale la pena. Pero no se abre hasta que los dos digan que sí — y nadie se entera si el otro dijo que no.</div></div>
      <div class="puerta-acciones">
        <button class="boton" data-otra="${esc(c.clave)}" data-decision="si">Sí, quiero conocer${pr === 'él' ? 'lo' : pr === 'ella' ? 'la' : 'le'}</button>
        <button class="boton boton-fantasma" data-otra="${esc(c.clave)}" data-decision="no">Ahora no</button>
      </div>`;
  }
  const r = c.revelado;
  return `<article class="tarjeta coincidencia" id="c-${esc(c.clave)}">
    <div class="coin-cabeza">${anillo(c.pct)}
      <div class="coin-titulo">
        <h3>${abierta ? esc(r.nombre) : `Alguien al ${c.pct} % contigo`}</h3>
        <div class="meta">${abierta ? `${esc(r.edad)} · ${esc(r.ciudad)}` : `Aviso ${c.puerta.avisada ? hace(c.puerta.avisada) : 'reciente'} · identidad protegida`}</div>
      </div>
    </div>
    <ul class="razones">
      ${c.fuertes.map((f) => `<li><span class="i si">✓</span><span><small>${esc(f.dim)}</small>${esc(f.txt)}</span></li>`).join('')}
      ${c.cuidar ? `<li><span class="i ojo">~</span><span><small>Lo que tendrían que cuidar · ${esc(c.cuidar.dim)}</small>${esc(c.cuidar.txt)}</span></li>` : ''}
    </ul>
    <div class="puerta-zona">${puerta}
      ${c.demoId && !abierta ? `<a class="demo-herramienta" href="/persona?id=${esc(c.demoId)}">👁 Herramienta de demo: ver el panel de esa persona</a>` : ''}
    </div>
    ${abierta ? `<div class="revelado">
      <div class="quien">${avatar(r.nombre, r.color, 'xl')}<div><h3>${esc(r.nombreCompleto)}</h3><div class="meta" style="color:var(--gris)">${esc(r.edad)} · ${esc(r.ciudad)}</div></div></div>
      ${r.carta ? `<div class="carta">${esc(r.carta)}</div>` : ''}
      ${r.malinterpretan ? `<p class="entender"><b>Lo que le gustaría que entendieras desde el día uno:</b> ${esc(r.malinterpretan)}</p>` : ''}
      <div class="proximos"><div><span>🎙️</span>Su voz leyendo esta carta</div><div><span>🎬</span>Un video de su martes</div><div><span>📷</span>Y al final, sus fotos</div></div>
      <p class="seccion-sub" style="margin:12px 0 0">En la versión real, cada paso lo abres tú, en ese orden: primero quién es, al final cómo se ve.</p>
      ${c.demoId ? `<a class="demo-herramienta" href="/persona?id=${esc(c.demoId)}">👁 Herramienta de demo: ver su panel</a>` : ''}
    </div>` : ''}
  </article>`;
}

async function decidir(clave, decision, boton) {
  const [a, b] = clave.split('-');
  const otra = a === vista.persona.id ? b : a;
  boton.disabled = true;
  try {
    const r = await api('/api/puerta', token ? { token, otra, decision } : { persona: vista.persona.id, otra, decision });
    const antes = vista.coincidencias.find((c) => c.clave === clave);
    vista = r.vista;
    pintarPanel();
    if (r.estado === 'abierta' && antes?.puerta.estado !== 'abierta') {
      const tarjeta = $('#c-' + CSS.escape(clave));
      tarjeta?.scrollIntoView({ block: 'start' });
      // la puerta se pinta cerrada y se abre frente a la persona
      const pu = tarjeta?.querySelector('.puerta');
      if (pu && !document.hidden) { pu.classList.remove('abierta'); requestAnimationFrame(() => requestAnimationFrame(() => pu.classList.add('abierta'))); }
      avisar('💘 Los dos dijeron que sí. Se abrió la puerta.', 4200);
    } else avisar(decision === 'si' ? 'Tu sí quedó guardado. Nadie lo verá hasta que haya dos.' : 'Listo. Nadie lo sabrá.');
  } catch (e) { boton.disabled = false; avisar(e.message); }
}

async function abrirAvisos() {
  const caja = $('#avisos');
  caja.hidden = !caja.hidden;
  if (caja.hidden) return;
  caja.innerHTML = vista.avisos.length ? vista.avisos.map((a) => `<div class="aviso ${a.leido ? '' : 'nuevo'}"><span>${a.tipo === 'apertura' ? '🔓' : '💘'}</span><div>${esc(a.texto)}<span class="cuando">${hace(a.creado)}</span></div></div>`).join('') : '<p class="vacio">Sin avisos todavía.</p>';
  if (vista.avisos.some((a) => !a.leido)) {
    try { await api('/api/avisos/leer', token ? { token } : { persona: vista.persona.id }); vista.avisos.forEach((a) => a.leido = 1); $('#btn-avisos .n')?.remove(); } catch {}
  }
}
</script>
</body>
</html>
