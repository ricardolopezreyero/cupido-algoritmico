<script type="module">
// RLR · el recorrido: diez pantallas; tres segundos mínimo en cada una; sin salida la primera vez; el avance se guarda
import { $, $$, esc, api } from '/js/ui.js';
import { tocar, precargar } from '/js/sonido.js';
precargar(['paso', 'bienvenida', 'toque', 'puerta', 'si', 'coincidencia', 'mensaje', 'estilo']);
const _RLR = 'Ricardo López Reyero', _k = 'EYE', _rev = 181218;
const q = new URLSearchParams(location.search);
const luego = q.get('luego');
const repaso = q.get('repaso') === '1';
const ESPERA = 3; // segundos mínimos por pantalla, el ritmo de Cupido
let sesion = null; // { demo, completo, ficticia, nombre, ajustes } o null sin cuenta
try { const v = await api('/api/yo'); sesion = { demo: !!v.sesion?.demo, completo: !!v.persona?.completo, ficticia: v.persona?.origen === 'demo', nombre: v.persona?.nombreCorto || '', ajustes: v.ajustes || {} }; } catch {}
const real = sesion && !sesion.demo;
const LLAVE_DEMO = 'cupido.bienvenida.demo';
const leerDemo = () => { try { return JSON.parse(localStorage.getItem(LLAVE_DEMO) || '{}'); } catch { return {}; } };
const guardarDemo = (o) => { try { localStorage.setItem(LLAVE_DEMO, JSON.stringify({ ...leerDemo(), ...o })); } catch {} };
const yaHecho = real ? !!sesion.ajustes.bienvenida : !!leerDemo().hecho;
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (repaso || yaHecho) { $('#pildora-repaso').hidden = false; $('#volver-tablero').hidden = !sesion; }
else { $('#marca').removeAttribute('href'); $('#marca').style.cursor = 'default'; } // la primera vez no hay salida: ni la marca lleva a otro lado

/* ── las diez pantallas ────────────────────────────────────────────────── */
const PASOS = [
  { id: 'que', eyebrow: 'Qué es Cupido', t: 'No es una app de citas. Es un sistema de <em>detección</em> de parejas.', p: 'No vas a ver perfiles, ni fotos, ni a deslizar a nadie. Respondes con la verdad una sola vez y un motor busca, entre todas las personas que buscan lo mismo que tú, a quien de verdad embona contigo. Solo te avisa cuando vale la pena. Lo demás es silencio, y el silencio también es servicio.',
    demo: `<div class="bv-que"><div class="bv-no"><span>📱 Deslizar</span><span>🖼️ Perfiles</span><span>📣 Anuncios</span><span>⏳ Perder el tiempo</span></div><div class="bv-flecha-abajo">↓</div><div class="bv-si"><b>Tu verdad + un motor + silencio hasta el 90 %</b></div></div>`,
    nota: 'Tú pon la verdad. Nosotros ponemos la lógica. El amor lo ponen ustedes dos.' },
  { id: 'verdad', eyebrow: 'Las 43 preguntas', t: 'Respondes <em>una sola vez</em>, con ejemplos, no con adjetivos.', p: 'Son 43 preguntas en diez categorías: lo que eres y lo que necesitas. Las de opción se responden con un toque; las abiertas las puedes <b>dictar con el micrófono</b> y, si quieres, el <b>pincel</b> las reacomoda con tus mismas palabras. Se guardan solas. Puedes parar y volver cuando quieras.',
    demo: `<div class="bv-pregunta" id="bv-pregunta"><div class="bv-p-n">Pregunta <b>14</b> de 43</div><h3 id="bv-p-t"></h3><div class="bv-opciones" id="bv-p-o"></div><div class="bv-herr"><span>🎤 Dictar</span><span>🖌️ Pulir</span></div><div class="bv-guardado">Guardado ✓</div></div>`,
    nota: 'Toca una opción. Así de rápido va, y nadie te apura.' },
  { id: 'motor', eyebrow: 'El motor', t: 'Te cruza en <em>las dos direcciones</em>.', p: 'Lo que tú necesitas contra lo que la otra persona da natural, y al revés. Diez dimensiones: visión de vida, familia, valores, conflicto y reparación, afecto, intimidad, fe, vida cotidiana, personalidad y lo que promete su carta. Tus innegociables eliminan pares completos; y lo que para ti es esencial pesa más en tu lado del cálculo.',
    demo: `<div class="bv-motor"><div class="bv-av a">T</div><div class="bv-flechas"><span class="f1">→</span><span class="f2">←</span></div><div class="bv-av b">?</div></div><div class="bv-dims" id="bv-dims"></div>`,
    nota: 'Si solo funciona para uno, se hunde. Nada compensa una dimensión hundida.' },
  { id: 'silencio', eyebrow: 'El silencio', t: 'Solo te avisamos <em>arriba del 90 %</em>.', p: 'Abajo de eso no ves nada, y no es que fallaras: te estamos ahorrando años con las personas incorrectas. Cuando suene tu teléfono, va en serio, y le suena a la otra persona en el mismo instante. Mientras tanto, tu tablero te dice cómo va tu búsqueda y qué filtros tuyos te están dejando fuera.',
    demo: `<div class="bv-lista" id="bv-lista"></div>`,
    nota: 'Una sola cruzó el umbral. Es la única que vas a ver.' },
  { id: 'puerta', eyebrow: 'La puerta', t: 'Se abre solo con <em>dos síes</em>.', p: 'Te avisamos que hay alguien al 90 % o más, pero no te dejamos entrar. Tú dices sí o no; la otra persona también. <b>Nadie se entera nunca de un no.</b> Si los dos dicen que sí, la puerta se abre para ambos en el mismo momento. Y abrir una puerta está incluido: todo Cupido es gratis durante 2026 y 2027.',
    demo: `<div class="bv-puerta"><div class="puerta" id="bv-p"><div class="marco"></div><div class="luz"></div><div class="hoja"></div><span class="candado">🔒</span></div><div class="bv-sies"><button class="boton" id="bv-si-a">Tú: sí, quiero conocer</button><button class="boton boton-claro" id="bv-si-b" disabled>La otra persona: …</button></div><p class="bv-puerta-txt" id="bv-puerta-txt">Tu sí queda guardado. Nadie lo ve hasta que haya dos.</p></div>`,
    nota: 'Toca tu sí y luego el suyo. Mira lo que pasa.' },
  { id: 'charla', eyebrow: 'La charla', t: 'Nace sola, y el primer <em>hola</em> ya está dicho.', p: 'Cuando la puerta se abre, el sistema manda un hola de parte de cada uno para que nadie tenga que dar el primer paso. La charla es en vivo: ves cuando la otra persona escribe, si está en línea, y "visto". Texto, emojis, fotos, video, notas de voz, responder citando, guardar y buscar. Sin anuncios. Solo ustedes dos.',
    demo: `<div class="bv-chat" id="bv-chat"></div><div class="bv-escribe" id="bv-escribe" hidden><span></span><span></span><span></span></div>`,
    nota: 'Lo primero que conoces de la otra persona es su carta, no su foto.' },
  { id: 'confianza', eyebrow: 'La confianza', t: 'Cada quien libera su perfil <em>a su ritmo</em>.', p: 'Nadie ve tus respuestas por abrir una puerta. Las compartes por elementos, con tu confirmación: seis suaves que se proponen de entrada (quién eres, visión de vida, personalidad, afecto, vida cotidiana, profundidad) y cuatro sensibles que liberas después, uno por uno: fe e hijos, valores y dinero, conflicto, intimidad. Lo sensible se pregunta dos veces, y ella puede guardar de nuevo lo que compartió cuando quiera.',
    demo: `<div class="bv-elementos" id="bv-elementos"></div>`,
    nota: 'Toca un candado para ver cómo se libera un elemento.' },
  { id: 'rostro', eyebrow: 'Al final, cómo te ves', t: 'Tu foto, tu voz y tu video llegan <em>al final</em>.', p: 'Se suben solo cuando tu cuestionario está al 100 %, y la otra persona los ve únicamente si hay una puerta abierta entre ustedes; ella, además, decide en qué momento los enseña. Primero quién eres, al final cómo te ves. El servidor lo verifica cada vez: tus archivos no aparecen en ninguna lista, nunca.',
    demo: `<div class="bv-rostro" id="bv-rostro"><div class="paso-r" data-k="0"><span>📝</span>Cuestionario al 100 %</div><div class="paso-r" data-k="1"><span>🔓</span>Puerta abierta</div><div class="paso-r" data-k="2"><span>🎙️</span>Su voz</div><div class="paso-r" data-k="3"><span>🎬</span>Su video</div><div class="paso-r" data-k="4"><span>📷</span>Su foto</div></div>`,
    nota: 'En ese orden, siempre. Nadie elige a nadie por una foto.' },
  { id: 'ella', eyebrow: 'La regla de la casa', t: 'Aquí <em>manda ella</em>.', p: 'Cupido está hecho para que una mujer encuentre a la persona correcta: segura, cómoda y en control. <b>Si ella bloquea, queda bloqueado. Si diez mujeres distintas bloquean al mismo hombre, queda fuera para siempre.</b> Ella decide qué recibe y cuándo enseña su foto; él no puede insistir. Y cualquiera de los dos puede cerrar la puerta cuando quiera, sin dar explicaciones y sin castigo: cerrar no es bloquear. Al seguir, aceptas esta regla.',
    demo: `<div class="bv-ella" id="bv-ella"><div class="bv-poder"><span>🖼️</span>Su foto, su voz y su video: los enseña ella</div><div class="bv-poder"><span>📎</span>Él no manda archivos hasta que ella lo permite</div><div class="bv-poder"><span>✋</span>Cinco mensajes sin respuesta, y a él le toca esperar</div><div class="bv-poder"><span>🚪</span>Cerrar la puerta: sin motivo y sin castigo</div><div class="bv-poder"><span>⛔</span>Bloquear: nunca se vuelven a cruzar</div><div class="ella-contador" id="bv-diez"></div><p class="bv-puerta-txt" id="bv-diez-txt">Diez mujeres distintas.</p></div>`,
    nota: 'Un lugar donde ellas se sienten seguras es el único donde una mujer seria contesta en serio.' },
  { id: 'tablero', eyebrow: 'Tu tablero y tu palabra', t: 'Tu búsqueda, <em>a tu ritmo</em>. Y todo gratis.', p: 'Tu camino en cinco pasos, tus logros, cómo se ve tu vida hoy, tu estilo, pausa cuando estés conociendo a alguien. Sin contraseña: tu correo es tu llave. Lo íntimo solo lo lee el motor. Y <b>todo Cupido es gratis durante 2026 y 2027</b>, sin anuncios. Lo que más ayuda es que compartas Cupido con alguien que busque en serio.',
    demo: `<div class="bv-tablero"><div class="bv-t-lat"><span>🏠 Inicio</span><span>💘 Coincidencias</span><span>🤝 Aceptaciones</span><span>💬 Charlas</span><span>🧭 Mi vida hoy</span><span>📷 Foto, voz y video</span><span>🎨 Mi estilo</span><span>🤍 Apoyar a Cupido</span></div><div class="bv-t-cont"><div class="bv-camino" id="bv-camino"></div><div class="bv-colores" id="bv-colores"></div><p class="bv-gratis">🤍 Gratis en 2026 y 2027 · sin anuncios · sin letra chica</p></div></div>`,
    nota: 'Toca un color: el tablero es tuyo hasta en eso.' },
];

/* ── estado: dónde vas, y se guarda ─────────────────────────────────────── */
let i = 0;
if (!repaso && !yaHecho) i = Math.max(0, Math.min(PASOS.length - 1, real ? Number(sesion.ajustes.bienvenida_paso || 0) : Number(leerDemo().paso || 0)));
let timers = [], reloj = null, auto = false, autoT = null;
const lienzo = $('#bv-lienzo');
function limpiar() { timers.forEach(clearTimeout); timers = []; }
const luegoDe = (ms, fn) => timers.push(setTimeout(fn, reducido ? 0 : ms));
async function guardarPaso() { if (real) { try { await api('/api/yo/ajustes', { bienvenida_paso: i }); } catch {} } else guardarDemo({ paso: i }); }

function pintar(dir = 1) {
  limpiar(); clearInterval(reloj);
  const p = PASOS[i], final = i === PASOS.length - 1;
  lienzo.innerHTML = `<section class="bv-paso ${dir > 0 ? 'entra' : 'entra-atras'}">
    <div class="bv-texto"><p class="eyebrow">Paso ${i + 1} de ${PASOS.length} · ${p.eyebrow}</p><h1>${p.t}</h1><p class="lead">${p.p}</p>${final ? cta() : ''}</div>
    <div class="bv-demo"><div class="bv-demo-in">${p.demo}</div><p class="bv-nota">${p.nota}</p></div>
  </section>`;
  $('#bv-relleno').style.width = ((i + 1) / PASOS.length * 100) + '%';
  $('#bv-puntos').innerHTML = PASOS.map((x, k) => `<span class="${k === i ? 'on' : k < i ? 'hecho' : ''}" aria-label="Paso ${k + 1}"></span>`).join('');
  $('#bv-atras').disabled = i === 0;
  $('#bv-sig-txt').textContent = final ? (real ? 'Entrar a Cupido →' : sesion ? 'Ir a mi tablero →' : 'Empezar →') : 'Siguiente →';
  document.title = `${p.eyebrow} · El recorrido · Cupido Algorítmico`;
  (DEMOS[p.id] || (() => {}))();
  window.scrollTo(0, 0);
  guardarPaso();
  cuentaRegresiva(final);
}
// Tres segundos mínimo en cada pantalla: el botón se enciende cuando el reloj llega a cero
function cuentaRegresiva(final) {
  const sig = $('#bv-sig'), seg = $('#bv-seg'), arco = $('#bv-reloj .arco');
  let t = ESPERA; sig.disabled = true; sig.classList.add('esperando'); seg.textContent = t;
  arco.style.transition = 'none'; arco.style.strokeDashoffset = '0';
  requestAnimationFrame(() => { arco.style.transition = `stroke-dashoffset ${ESPERA}s linear`; arco.style.strokeDashoffset = String(2 * Math.PI * 15.5); });
  reloj = setInterval(() => {
    t--; seg.textContent = Math.max(0, t);
    if (t <= 0) { clearInterval(reloj); sig.disabled = false; sig.classList.remove('esperando'); seg.textContent = '✓'; tocar('toque', { fuerza: 0.6 }); if (auto && !final) autoT = setTimeout(() => { if (auto) $('#bv-sig').click(); }, 350); }
  }, 1000);
}
$('#bv-sig').onclick = () => { if ($('#bv-sig').disabled) return; clearTimeout(autoT); if (i === PASOS.length - 1) { tocar('bienvenida'); setTimeout(irseAlFinal, 900); } else { tocar('paso'); i++; pintar(1); } };
$('#bv-atras').onclick = () => { if (i > 0) { clearTimeout(autoT); i--; pintar(-1); } };
$('#bv-play').onclick = () => { auto = !auto; $('#bv-play').classList.toggle('on', auto); $('#bv-play').querySelector('span').textContent = auto ? 'En automático' : 'Automático'; if (auto && !$('#bv-sig').disabled && i < PASOS.length - 1) $('#bv-sig').click(); };
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'Enter') $('#bv-sig').click(); if (e.key === 'ArrowLeft') $('#bv-atras').click(); });
let tx = null;
lienzo.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
lienzo.addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) (dx < 0 ? $('#bv-sig') : $('#bv-atras')).click(); tx = null; });

function cta() {
  if (real) return `<div class="bv-cta"><span class="nota-entrar" style="margin:0;text-align:left">${sesion.completo ? 'Tu tablero te espera.' : 'Lo que sigue: tus 43 preguntas. Se guardan solas; puedes parar cuando quieras.'}</span></div>`;
  if (sesion) return `<div class="bv-cta"><span class="nota-entrar" style="margin:0;text-align:left">Vas a entrar a la cuenta demo: el tablero de una persona ficticia, con todo lo que acabas de ver.</span></div>`;
  return `<div class="bv-cta"><a class="boton boton-claro" href="/entrar">Crear mi cuenta con mi correo</a><a class="boton boton-claro" href="/demo">Ver el demo primero</a></div>`;
}
async function irseAlFinal() {
  if (real) { try { await api('/api/yo/ajustes', { bienvenida: true, reglas: true }); } catch {} location.href = luego === 'cuestionario' || !sesion.completo ? '/cuestionario' : '/persona'; }
  else if (sesion) { guardarDemo({ hecho: true, fecha: new Date().toISOString() }); location.href = '/persona'; }
  else { guardarDemo({ hecho: true, fecha: new Date().toISOString() }); location.href = '/entrar'; }
}

/* ── las mini-demos (cada pantalla se mueve) ────────────────────────────── */
const DEMOS = {
  que() { $$('.bv-no span').forEach((s, k) => luegoDe(300 + k * 350, () => s.classList.add('tachado'))); luegoDe(1900, () => $('.bv-si')?.classList.add('on')); },
  verdad() {
    const PREG = [['¿Cómo recargas energía después de una semana pesada?', ['Solo, en silencio', 'Depende del día', 'Con gente']], ['Cuando algo de tu pareja te molesta de verdad, ¿qué haces?', ['Lo hablo con calma', 'Lo guardo y luego explota', 'Me alejo un rato']], ['¿Cómo sientes con más fuerza que te aman?', ['Tiempo de calidad', 'Palabras', 'Contacto físico']]];
    let n = 0;
    const mostrar = () => { const [t, o] = PREG[n % PREG.length]; $('#bv-p-t').textContent = t; $('#bv-pregunta .bv-p-n b').textContent = [14, 19, 23][n % 3]; $('#bv-p-o').innerHTML = o.map((x) => `<button type="button">${esc(x)}</button>`).join(''); $('#bv-pregunta').classList.remove('guardado'); $$('#bv-p-o button').forEach((b) => b.onclick = () => { $$('#bv-p-o button').forEach((x) => x.classList.toggle('sel', x === b)); $('#bv-pregunta').classList.add('guardado'); luegoDe(1100, () => { n++; mostrar(); }); }); };
    mostrar(); luegoDe(2000, () => { const b = $('#bv-p-o button'); if (b && !$('#bv-pregunta').classList.contains('guardado')) b.click(); });
  },
  motor() {
    const D = [['Visión de vida', 96], ['Valores', 92], ['Conflicto y reparación', 88], ['Afecto', 97], ['Intimidad', 90], ['Vida cotidiana', 94]];
    $('#bv-dims').innerHTML = D.map(([n, v]) => `<div class="bv-dim"><span>${n}</span><div class="pista"><div class="relleno" data-w="${v}"></div></div><b>${v}</b></div>`).join('') + `<div class="bv-total">Los dos lados, juntos: <b id="bv-total">0</b> %</div>`;
    luegoDe(150, () => $$('#bv-dims .relleno').forEach((r) => r.style.width = r.dataset.w + '%'));
    let v = 0; const meta = 94; const paso = () => { v = Math.min(meta, v + 2); $('#bv-total').textContent = v; if (v < meta) luegoDe(40, paso); }; luegoDe(400, paso);
  },
  silencio() {
    const L = [71, 78, 84, 88, 92, 66];
    $('#bv-lista').innerHTML = L.map((v, k) => `<div class="bv-par ${v >= 90 ? 'suena' : 'calla'}" style="animation-delay:${k * 160}ms"><span class="pct">${v} %</span><span>${v >= 90 ? '🔔 Te avisamos a ti y a esa persona, a la vez' : 'silencio'}</span></div>`).join('');
  },
  puerta() {
    const A = $('#bv-si-a'), B = $('#bv-si-b'), P = $('#bv-p'), T = $('#bv-puerta-txt');
    const suyo = () => { B.disabled = true; B.textContent = 'Sí 🤍'; P.classList.add('abierta'); tocar('puerta'); T.innerHTML = '<b>Se abrió la puerta.</b> Para los dos, en el mismo instante. Y si alguien hubiera dicho que no, el otro jamás lo sabría.'; };
    A.onclick = () => { A.disabled = true; tocar('si'); A.textContent = 'Tu sí está guardado 🤍'; T.textContent = 'Nadie lo ve todavía. La otra persona también está decidiendo…'; luegoDe(1400, () => { B.disabled = false; B.textContent = 'La otra persona: sí, quiero conocer'; B.classList.remove('boton-claro'); T.textContent = 'Toca su sí.'; }); B.onclick = suyo; };
    luegoDe(2600, () => { if (!A.disabled) A.click(); luegoDe(2200, () => { if (!B.disabled) B.click(); }); });
  },
  charla() {
    const chat = $('#bv-chat'), esc2 = $('#bv-escribe');
    const burb = (mio, t, extra = '') => `<div class="bv-b ${mio ? 'mio' : 'suyo'}">${esc(t)}${extra}</div>`;
    const guion = [[true, 'Hola, Mariana 👋', '<small>saludo automático</small>'], [false, 'Hola, Diego 👋', '<small>saludo automático</small>'], [false, 'Leí tu carta dos veces. ¿Cómo fue tu martes?', ''], [true, 'Largo, pero bonito. Te cuento con una nota de voz 🎤', '<small>Visto ✓✓</small>']];
    guion.forEach(([m, t, x], k) => luegoDe(400 + k * 1100, () => { if (k === 2) esc2.hidden = true; if (!m) tocar('mensaje', { fuerza: 0.6 }); chat.insertAdjacentHTML('beforeend', burb(m, t, x)); chat.scrollTop = chat.scrollHeight; }));
    luegoDe(1700, () => { esc2.hidden = false; });
  },
  confianza() {
    const E = [['🧭', 'Quién soy', true], ['🌅', 'Visión de vida', true], ['⚡', 'Personalidad', true], ['🤍', 'Afecto', true], ['🏠', 'Vida cotidiana', true], ['🪞', 'Profundidad', true], ['⚖️', 'Valores y dinero', false], ['🔥', 'Conflicto', false], ['🕯️', 'Fe e hijos', false], ['🔐', 'Intimidad', false]];
    $('#bv-elementos').innerHTML = E.map(([ic, n, s], k) => `<button type="button" class="bv-el ${s ? '' : 'sensible'}" data-k="${k}"><span>🔒</span>${n}${s ? '' : ' <small>sensible</small>'}</button>`).join('');
    $$('.bv-el').forEach((b) => b.onclick = () => { if (b.classList.contains('on')) return; b.classList.add('on'); b.querySelector('span').textContent = E[Number(b.dataset.k)][0]; });
    [0, 1, 2].forEach((k, j) => luegoDe(900 + j * 500, () => $$('.bv-el')[k]?.click()));
  },
  ella() {
    $$('#bv-ella .bv-poder').forEach((el, k) => luegoDe(250 + k * 380, () => el.classList.add('on')));
    const c = $('#bv-diez'), t = $('#bv-diez-txt'); c.innerHTML = Array.from({ length: 10 }, (_, k) => `<i>${k + 1}</i>`).join('');
    $$('i', c).forEach((el, k) => luegoDe(2300 + k * 170, () => { el.classList.add('on'); if (k === 9) { c.classList.add('fuera'); t.innerHTML = '<b>Fuera para siempre.</b> Nadie bloquea a un desconocido: solo cuenta quien cruzó el 90 % con él y abrió la puerta.'; } }));
  },
  rostro() { $$('.paso-r').forEach((el, k) => luegoDe(400 + k * 550, () => el.classList.add('on'))); },
  tablero() {
    const C = [['📝', 'Responder'], ['⚙️', 'Matching'], ['💘', 'Coincidencia'], ['🤍', 'Tu sí'], ['🔓', 'Puerta abierta']];
    $('#bv-camino').innerHTML = C.map(([ic, t], k) => `<div class="bv-c" style="animation-delay:${k * 260}ms"><div>${ic}</div><span>${t}</span></div>`).join('');
    const COL = [['#d6455f', 'Rosa'], ['#8e2043', 'Vino'], ['#2f55c9', 'Azul'], ['#1f8a7a', 'Verde']];
    $('#bv-colores').innerHTML = `<span>Tu estilo:</span>` + COL.map(([c, n]) => `<button type="button" style="background:${c}" title="${n}"></button>`).join('');
    $$('#bv-colores button').forEach((b) => b.onclick = () => { tocar('estilo'); document.documentElement.style.setProperty('--rosa', b.style.background); document.documentElement.style.setProperty('--rosa-osc', b.style.background); $$('#bv-colores button').forEach((x) => x.classList.toggle('on', x === b)); });
  },
};
pintar(1);
</script>
