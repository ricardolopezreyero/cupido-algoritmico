<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo del cuestionario — Cupido Algorítmico</title>
<style>
  :root{
    --bg:#ffffff; --soft:#faf7f4; --ink:#211d24; --muted:#75707c;
    --accent:#d6455f; --accent-dark:#b23349; --line:#eae5df; --ok:#2e8b57;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;font-size:16px}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);
    border-bottom:1px solid var(--line)}
  .topbar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
    color:var(--ink);text-decoration:none;white-space:nowrap}
  .demo-pill{font-size:12px;background:#fdf1e3;color:#9a5b16;border:1px solid #f2ddc2;
    padding:3px 10px;border-radius:999px;font-weight:600}
  .spacer{margin-left:auto}
  .exit{color:var(--muted);text-decoration:none;font-size:14px}
  .progress-wrap{max-width:960px;margin:0 auto;padding:0 16px 10px}
  .ptext{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
  .pbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
  .pfill{height:100%;background:linear-gradient(90deg,var(--accent),#e77a4e);
    border-radius:99px;transition:width .35s}
  main{max-width:640px;margin:0 auto;padding:30px 20px 120px}
  .qnum{font-size:13px;color:var(--accent-dark);font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;margin-bottom:8px}
  h2.qtitle{font-family:Georgia,serif;font-size:23px;line-height:1.42;margin:0 0 6px;font-weight:600}
  .qnote{color:var(--muted);font-size:14.5px;font-style:italic;margin:6px 0 0}
  .helps{margin:20px 0 4px}
  details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--soft)}
  details summary{cursor:pointer;padding:11px 14px;font-size:14.5px;font-weight:600;color:#5d5864;list-style:none}
  details summary::before{content:"▸ ";color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  details .dbody{padding:0 16px 13px;font-size:14.5px;color:#4c4752}
  .parts{margin-top:18px}
  .part{margin:20px 0}
  .plabel{font-weight:600;font-size:15px;margin-bottom:10px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;
    background:#fff;font-size:15px;text-align:left;transition:all .12s;color:var(--ink)}
  .opt:hover{border-color:#d9b7be}
  .opt.sel{border-color:var(--accent);background:#fdf1f3;font-weight:600}
  .scale{display:flex;gap:8px;justify-content:space-between}
  .scale .opt{flex:1;text-align:center;padding:13px 4px}
  .scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
  textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;
    padding:14px;font:inherit;font-size:15.5px;resize:vertical;background:#fff;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--accent)}
  input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
    font:inherit;font-size:15.5px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .rank-hint{font-size:13.5px;color:var(--muted);margin-bottom:8px}
  .rank .opt{display:flex;align-items:center;gap:12px}
  .rank .num{min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .rank .num.empty{background:var(--soft);color:transparent;border:1.5px dashed var(--line)}
  .reset{background:none;border:none;color:var(--accent-dark);font-size:13.5px;cursor:pointer;
    padding:4px 0;text-decoration:underline}
  .savebar{font-size:13px;color:var(--muted);text-align:right;margin-top:14px}
  .savebar b{color:#9a5b16}
  .navbtns{display:flex;gap:10px;margin-top:26px;align-items:center}
  .btn{border:none;border-radius:999px;padding:13px 24px;font-size:15.5px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;margin-left:auto}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.ghost{background:none;color:var(--muted);border:1.5px solid var(--line)}
  .btn.later{background:none;color:var(--accent-dark);border:none;font-weight:600;font-size:14px;
    text-decoration:underline}
  .inter{text-align:center;padding:40px 0}
  .inter .big{font-size:44px}
  .inter h2{font-family:Georgia,serif;font-size:25px}
  .inter p{color:#4c4752;max-width:480px;margin:14px auto;font-size:16px}
  .blocktag{display:inline-block;background:#faeef0;color:var(--accent-dark);border-radius:999px;
    padding:5px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
  .summary-item{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);
    padding:11px 4px;cursor:pointer;font-size:14.5px}
  .summary-item:hover{background:var(--soft)}
  .summary-item .st{min-width:20px}
  .summary-item .tt{color:#4c4752}
  .done-check{color:var(--ok)} .pend{color:#c77}
  @media(max-width:520px){h2.qtitle{font-size:20px}.brand b{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <a class="brand" href="index.html"><span>💘</span><b>Cupido Algorítmico</b></a>
    <span class="demo-pill">DEMO · nada se guarda</span>
    <span class="spacer"></span>
    <a class="exit" href="index.html">Salir</a>
  </div>
  <div class="progress-wrap" id="progresswrap" style="display:none">
    <div class="ptext"><span id="ptext-left"></span><span id="ptext-right"></span></div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
  </div>
</div>

<main id="app"></main>

<script>
/* ============ DATOS: 41 preguntas ============ */
const BLOCKS = {
 1:"Filtros y logística", 2:"Visión de vida", 3:"Valores en acción",
 4:"Personalidad y energía", 5:"Conflicto y reparación", 6:"Afecto",
 7:"Vida cotidiana", 8:"Profundidad y verdad", 9:"Intimidad sexual", 10:"Conciencia y vida interior"
};
const LOVE = ["Tiempo de calidad","Palabras y reconocimiento","Contacto físico","Detalles y regalos","Actos de servicio"];

const Q = [
{n:1,b:1,t:"¿Cuál es tu edad, y qué rango de edad considerarías realmente para tu pareja?",
 help:{why:"Es un filtro bidireccional: solo hay match si cada uno cae en el rango del otro. Sé honesto con el rango — solo te presentaremos a quien de verdad considerarías."},
 parts:[{k:"text1",l:"Tu edad"},{k:"text1",l:"Rango que considerarías (ej. 28–38)"}]},
{n:2,b:1,t:"¿En qué ciudad vives, y qué tan lejos llegarías por la persona correcta?",
 help:{why:"La distancia no mata matches; la inflexibilidad mutua sí. No respondas lo romántico: responde lo real. ¿De verdad te irías?"},
 parts:[{k:"text1",l:"Tu ciudad"},{k:"choice",l:"¿Qué tan lejos llegarías?",o:["No me movería de mi ciudad","Me movería dentro de mi país","Me movería a otro país","A donde sea, si es la persona correcta"]}]},
{n:3,b:1,t:"¿Quieres hijos?",
 help:{why:"Es la pregunta que más parejas rompe. «Me inclino» es una respuesta perfectamente válida — no la conviertas en «seguro» para verte decidido."},
 parts:[{k:"choice",o:["Sí, con certeza","Me inclino a que sí","Me inclino a que no","No, con certeza","Ya tengo hijos y quiero más","Ya tengo hijos y no quiero más"]}]},
{n:4,b:1,t:"¿Qué papel juega la religión o espiritualidad en tu vida, y qué tan importante es que tu pareja la comparta?",
 help:{why:"Solo actúa como filtro si tú o la otra persona lo declaran innegociable. Dos líneas bastan para la primera parte."},
 parts:[{k:"text",l:"¿Qué practicas o crees?",min:60},{k:"choice",l:"¿Qué tan importante es que tu pareja lo comparta?",o:["No me importa lo que crea mi pareja","Prefiero compatibilidad, pero es negociable","Necesito que comparta mi fe / mi ausencia de fe"]}]},
{n:5,b:1,t:"¿Qué estás buscando exactamente?",
 help:{why:"No hay respuesta que te haga ver mejor. Hay respuesta que te empareja con quien quiere lo mismo."},
 parts:[{k:"choice",o:["Relación de por vida, con matrimonio","Relación de por vida, con o sin matrimonio","Relación seria, y ver hasta dónde llega"]},{k:"choice",l:"¿La exclusividad total es innegociable para ti?",o:["Sí","No"]}]},

{n:6,b:2,t:"Describe un martes normal de tu vida ideal dentro de 10 años.",
 note:"No describas tus sueños: describe un martes. La vida en pareja es de martes, no de bodas.",
 help:{why:"Comparamos escenarios reales: ciudad o campo, hijos presentes, ritmo, rol del trabajo.",
 start:"¿A qué hora despiertas? ¿Qué ves por la ventana? ¿Quién más está en la casa? ¿Qué haces a las 2 pm? ¿Y a las 9 de la noche?",
 ex:"«Despierto a las 6:30 en una casa con patio, no en el centro. Hago café mientras los niños se alistan. Trabajo desde casa hasta las 4…» — imperfecta y real: así se ve una buena respuesta."},
 parts:[{k:"text"}]},
{n:7,b:2,t:"¿Qué papel juega tu familia de origen en tu vida hoy, y qué papel esperas que juegue en tu relación de pareja?",
 help:{start:"¿Cada cuánto los ves o les hablas hoy? ¿Qué opinión esperas que tengan sobre tu pareja: mucha, poca, ninguna?"},
 parts:[{k:"text"}]},
{n:8,b:2,t:"¿Qué papel juega el trabajo y la ambición en tu vida — y qué esperas del trabajo y la ambición de tu pareja?",
 note:"Son dos preguntas: cómo eres tú, y qué buscas en el otro. Responde ambas.",
 parts:[{k:"text"}]},
{n:9,b:2,t:"Para ti, ¿qué es una vida bien vivida?",
 help:{start:"Imagina que tienes 80 años y miras atrás con paz. ¿Qué tuvo que haber pasado? ¿Qué habría hecho que sintieras que la desperdiciaste?"},
 parts:[{k:"text"}]},

{n:10,b:3,t:"¿Cuáles son los 3 valores que no negocias — y cómo se ven en tu vida diaria?",
 note:"Con ejemplos concretos, no en teoría.",
 help:{why:"«Honestidad» no dice nada. «Devolví un pago duplicado que nadie habría notado» lo dice todo.",
 start:"Estructura sugerida: Valor 1: ___. Se ve en mi vida así: ___ (× 3)."},
 parts:[{k:"text"}]},
{n:11,b:3,t:"Cuéntame una decisión difícil en la que elegiste tus principios por encima de tu conveniencia.",
 help:{start:"Piensa en: una renuncia, una devolución, una verdad que te costó decir, un favor que negaste, algo que pagaste sin que nadie viera. Vale un caso pequeño: importa el patrón, no la épica.",
 why:"Si de verdad no encuentras ninguno, escríbelo — eso también es una respuesta."},
 parts:[{k:"text"}]},
{n:12,b:3,t:"Sobre el dinero: ¿cómo eres tú, y cómo imaginas manejarlo en pareja?",
 help:{why:"El dinero es la primera causa de conflicto conyugal. No hay opción correcta: hay parejas alineadas y parejas en guerra."},
 parts:[{k:"choice",l:"Tú eres…",o:["Ahorrador","Equilibrado","Disfruto gastar lo que gano"]},{k:"choice",l:"En pareja imaginas…",o:["Todo en común","Una parte común y una individual","Cuentas separadas"]}]},
{n:13,b:3,t:"¿Qué tan importante es que tu pareja coincida contigo en visión política y social?",
 help:{why:"No te preguntamos por quién votas. Solo cuánto te importa coincidir."},
 parts:[{k:"choice",o:["Nada: se puede querer a alguien que vota distinto","Algo: prefiero afinidad, tolero diferencia","Mucho: necesito afinidad en lo esencial","Innegociable"]}]},

{n:14,b:4,t:"¿Cómo recargas energía, y cómo es tu viernes ideal?",
 parts:[{k:"choice",l:"Recargo energía…",o:["Solo o con muy poca gente","Depende","Rodeado de gente"]},{k:"choice",l:"Mi viernes ideal…",o:["Casa y calma","Plan pequeño (cena, cine, amigos cercanos)","Fiesta o evento social grande"]}]},
{n:15,b:4,t:"¿Cómo te llevas con el orden y los planes?",
 parts:[{k:"choice",o:["Planifico casi todo y me gusta así","Estructura flexible: plan general, improvisación en los detalles","Fluyo: los planes me estorban"]}]},
{n:16,b:4,t:"¿Qué dirían tus mejores amigos que es lo mejor de ti — y qué es lo más difícil de ti?",
 note:"Sé honesto/a en la segunda parte.",
 help:{start:"Truco: no respondas tú. Escucha a tu mejor amigo diciéndolo. ¿Qué diría con cariño… y qué diría con una cerveza encima?",
 why:"«Soy demasiado perfeccionista» no cuenta. Lo difícil de ti es algo que le ha costado a alguien que te quiere."},
 parts:[{k:"text"}]},
{n:17,b:4,t:"¿Qué te hace reír de verdad? Describe tu humor con ejemplos.",
 help:{start:"Abre tu app de mensajes mentalmente: ¿qué fue lo último que reenviaste riéndote? ¿Con quién te ríes hasta que duele, y de qué? ¿Qué te parece infantil o de mal gusto?"},
 parts:[{k:"text"}]},
{n:18,b:4,t:"Entre estabilidad y aventura, ¿dónde vives tú?",
 parts:[{k:"scale",lo:"Amo mi rutina y mi base",hi:"Necesito cambio constante"}]},

{n:19,b:5,t:"Cuando algo de tu pareja te molesta de verdad, ¿qué haces la mayoría de las veces?",
 note:"La de verdad, no la ideal.",
 help:{why:"No hay opción buena y mala: hay combinaciones de pareja que funcionan y otras que explotan. Mentir aquí es comprarte la explosión."},
 parts:[{k:"choice",o:["Lo digo en el momento, a veces en caliente","Espero a calmarme y lo hablo pronto","Me lo guardo, y a veces se acumula hasta que explota","Tiendo a evitar el tema esperando que pase"]}]},
{n:20,b:5,t:"Describe tu última discusión importante con alguien que amas.",
 help:{why:"Nadie va a leer esto más que el algoritmo. No busca culpables: busca cómo reparas."},
 parts:[{k:"text",l:"¿Por qué fue?",min:80},{k:"text",l:"¿Qué hiciste tú?",min:80},{k:"text",l:"¿Cómo terminó?",min:80}]},
{n:21,b:5,t:"Después de una pelea fuerte con tu pareja, ¿qué necesitas tú para volver a estar bien — y qué eres capaz de ofrecerle al otro?",
 help:{start:"¿Espacio o abrazo? ¿Hablarlo ya o mañana? ¿Qué gesto del otro te desarma? ¿Y qué eres capaz de dar tú aunque sigas enojado/a?"},
 parts:[{k:"text"}]},
{n:22,b:5,t:"¿Qué aprendiste de tu relación pasada más importante? ¿Qué harías diferente TÚ?",
 note:"No qué debió hacer diferente la otra persona.",
 help:{why:"No te pedimos revivir la historia ni contar qué hizo la otra persona. Solo una cosa: ¿qué harías diferente tú?"},
 parts:[{k:"text"}]},

{n:23,b:6,t:"¿Cómo sientes con más fuerza que te aman — y cómo demuestras amor tú?",
 help:{why:"El match no compara tu lista con la suya: compara lo que tú necesitas recibir con lo que el otro da naturalmente, en ambas direcciones."},
 parts:[{k:"rank",l:"Toca en orden: primero lo que MÁS te llega",o:LOVE},{k:"rank",l:"Ahora: cómo demuestras amor tú (primero lo más natural)",o:LOVE}]},
{n:24,b:6,t:"¿Cuánta cercanía necesitas en pareja?",
 help:{why:"Ni la simbiosis ni la independencia son mejores: son incompatibles entre sí."},
 parts:[{k:"choice",o:["Compartirlo casi todo: planes, amigos, tiempo","Muy juntos, pero cada quien con su mundo propio","Mucha independencia: nos elegimos, no nos absorbemos"]}]},
{n:25,b:6,t:"¿Qué papel juega la intimidad física en una relación para ti, y qué tan fácil te resulta hablar de lo que necesitas?",
 note:"Respondes solo lo que quieras y al nivel de detalle que tú elijas.",
 help:{start:"¿Qué lugar ocupa en tu lista de lo que hace funcionar una relación? ¿Te resulta fácil pedir lo que necesitas, o te cuesta?"},
 parts:[{k:"text"}]},
{n:26,b:6,t:"Cuando alguien que amas está en su peor momento, ¿cómo lo cuidas? Da un ejemplo real.",
 help:{start:"Piensa en la última vez que alguien que amas estuvo enfermo, triste o quebrado. ¿Qué hiciste — no qué sentiste, qué HICISTE?"},
 parts:[{k:"text"}]},

{n:27,b:7,t:"Hábitos: cómo eres tú, y qué aceptas en tu pareja.",
 help:{why:"La mitad de la fricción doméstica vive aquí. Un «no acepto» contra un hábito declarado es eliminatorio — por eso vale responder con verdad."},
 parts:[
  {k:"choice",l:"Alcohol — tú:",o:["Nada","Social","Frecuente"]},
  {k:"choice",l:"Alcohol — en tu pareja aceptas hasta:",o:["Nada","Social","Frecuente"]},
  {k:"choice",l:"Tabaco o vape — tú:",o:["No","Ocasional","Sí"]},
  {k:"choice",l:"Tabaco o vape — en tu pareja aceptas hasta:",o:["No","Ocasional","Sí"]},
  {k:"choice",l:"Ejercicio — tú:",o:["Nada","A veces","Parte de mi vida"]},
  {k:"choice",l:"Ejercicio — en tu pareja prefieres:",o:["Me da igual","Que se mueva algo","Que sea activo/a como yo"]},
  {k:"choice",l:"Mascotas — tú:",o:["Tengo y son familia","Me gustan","Prefiero sin mascotas"]},
  {k:"choice",l:"Mascotas — aceptas en tu pareja:",o:["Que tenga y sean familia","Que le gusten","Prefiero que no tenga"]}]},
{n:28,b:7,t:"Tu ritmo y tu espacio.",
 help:{why:"El conflicto no viene del desorden: viene de la brecha entre el desorden de uno y el umbral del otro."},
 parts:[{k:"choice",l:"¿Madrugas o trasnochas?",o:["Madrugador","Flexible","Nocturno"]},
  {k:"scale",l:"¿Qué tan ordenada está tu casa HOY? (no después de limpiar el sábado)",lo:"Caos",hi:"Impecable"},
  {k:"choice",l:"¿Qué tanto te molesta el desorden del otro?",o:["Poco","Algo","Mucho"]}]},
{n:29,b:7,t:"Describe tu domingo perfecto, de principio a fin.",
 help:{start:"¿A qué hora abres los ojos? ¿Qué desayunas? ¿Con quién? ¿Qué NO puede pasar en tu domingo perfecto?"},
 parts:[{k:"text"}]},
{n:30,b:7,t:"En la casa que compartan, ¿cómo imaginas la división de tareas y responsabilidades?",
 help:{why:"No hay modelo correcto. Hay parejas donde los dos quieren lo mismo — y parejas condenadas a pelear cada carga de lavadora."},
 parts:[{k:"choice",o:["50/50 explícito","El que pueda en cada etapa, con flexibilidad","Roles claros y distintos (uno provee más, otro sostiene más el hogar)","Se conversa y se rediseña cada vez que cambie la vida"]}]},

{n:31,b:8,t:"¿Qué es algo de ti que la gente suele malinterpretar — y qué te gustaría que tu pareja entendiera desde el día uno?",
 help:{start:"Completa: «La gente cree que soy ___, pero en realidad ___». ¿Qué primera impresión das que no te hace justicia?"},
 parts:[{k:"text"}]},
{n:32,b:8,t:"¿Por qué crees que sigues soltero/a?",
 note:"Con honestidad — sin humildad falsa y sin culpar al resto del mundo.",
 help:{why:"Es la pregunta que más dice de ti en todo el cuestionario. No te castiga por la respuesta: te premia por la honestidad.",
 start:"Prohibido responder «no he encontrado a la persona correcta» — eso es la pregunta, no la respuesta. ¿Qué has elegido, evitado, priorizado o temido TÚ?",
 ex:"«Trabajo demasiado y lo sé. Y cuando alguien se acerca de verdad, encuentro un defecto para irme antes de que me lo encuentren a mí.» — vulnerable e imperfecta: eso es una respuesta de verdad."},
 parts:[{k:"text"}]},
{n:33,b:8,t:"Escríbele una carta corta a tu futura pareja: ¿qué le prometes, y qué le pides?",
 note:"Esta carta es lo primero que tu match leerá de ti.",
 help:{start:"Dos párrafos bastan: «Te prometo…» y «Te pido…». Escríbela a UNA persona, no a un público."},
 parts:[{k:"text",min:180}]},

{n:34,b:9,t:"En una relación estable y buena, ¿cuál sería tu frecuencia ideal de intimidad sexual?",
 help:{why:"El desajuste de deseo es de las primeras causas reales de ruptura. Preguntarlo hoy es más barato que descubrirlo en el año dos."},
 parts:[{k:"choice",o:["Varias veces por semana","Una o dos veces por semana","Algunas veces al mes","La frecuencia me importa poco si hay conexión"]},{k:"choice",l:"¿Qué tan negociable es esto para ti?",o:["Muy negociable","Algo negociable","Poco negociable"]}]},
{n:35,b:9,t:"Entre lo clásico y lo explorador, ¿dónde estás tú — y dónde necesitas que esté tu pareja?",
 parts:[{k:"scale",l:"Tú:",lo:"Lo tradicional me llena",hi:"Explorar es esencial"},{k:"choice",l:"Tu pareja:",o:["Prefiero que sea como yo","Me gustaría que me abriera mundo","Necesito que respete mis límites sin presionarme"]}]},
{n:36,b:9,t:"¿Qué te hace sentir profundamente deseado/a — y qué te apaga por completo?",
 help:{start:"No pienses en técnica: piensa en la última vez que te sentiste verdaderamente deseado/a. ¿Qué lo provocó? ¿Y qué gesto, frase o actitud te ha sacado por completo del momento?"},
 parts:[{k:"text"}]},
{n:37,b:9,t:"En tus relaciones pasadas, cuando uno quería y el otro no — ¿cómo lo manejaste tú?",
 note:"¿Con palabras, con distancia, con reclamo, con paciencia?",
 help:{why:"Todas las parejas del mundo viven esto. No te descalifica haberlo manejado mal: descalifica no saber cómo lo manejas."},
 parts:[{k:"text"}]},
{n:38,b:9,t:"¿Qué es innegociable para ti en lo sexual — como necesidad y como límite?",
 note:"Di la verdad completa: esta respuesta decide matches.",
 help:{why:"Un límite callado hoy es una ruptura programada. Nadie humano la lee. Cuesta un minuto aquí, o cuesta dos años después."},
 parts:[{k:"text"}]},

{n:39,b:10,t:"¿Qué prácticas sostienen tu vida interior — y qué papel esperas que jueguen en tu vida en pareja?",
 note:"Meditación, oración, terapia, escribir, naturaleza… o nada. Todas son respuestas válidas.",
 help:{why:"No nos digas qué crees: dinos qué HACES, y cada cuánto."},
 parts:[{k:"text"}]},
{n:40,b:10,t:"Sobre tu propio crecimiento: ¿dónde estás?",
 help:{why:"El desnivel de conciencia es la fuente silenciosa de «ya no hablamos el mismo idioma» a los cinco años."},
 parts:[{k:"choice",o:["Estoy en paz con quien soy; no busco reinventarme","Trabajo en mí cuando la vida lo exige","El crecimiento constante (terapia, lectura, práctica) es central en mi vida"]},{k:"choice",l:"¿Y tu pareja?",o:["Necesito que crezca conmigo","Basta con que me acompañe"]}]},
{n:41,b:10,t:"Cuéntame la última vez que cambiaste de opinión sobre algo importante de ti mismo/a. ¿Qué te lo mostró?",
 parts:[{k:"text"}]},
];

/* pantallas intermedias */
const INTERS = {
 start:{big:"💘",h:"Antes de empezar",
  p:["Son <b>41 preguntas</b> (33 base + 8 del módulo profundo). A la mayoría le toma entre 40 y 60 minutos hacerlo bien — no tiene que ser de corrido.",
     "En la versión real <b>todo se guarda solo</b>: puedes salir cuando quieras y seguir donde ibas. Puedes editar cualquier respuesta cuando quieras. <i>(En este demo nada se guarda — es solo para que sientas la experiencia.)</i>",
     "No hay respuestas correctas: hay respuestas tuyas."],btn:"Empezar"},
 before19:{big:"🫁",h:"Llevas más de la mitad ✓",
  p:["Las siguientes 4 preguntas son las más importantes del cuestionario — y las menos cómodas.",
     "Si quieres, toma aire. En la versión real podrías continuar mañana: todo estaría guardado."],btn:"Continuar"},
 before31:{big:"🌅",h:"Últimas 3 del cuestionario base",
  p:["Son las que tu futuro match va a sentir más.",
     "Si estás en modo «ya acabemos», en la versión real te sugeriríamos terminar mañana fresco. En el demo… tú decides."],btn:"Vamos"},
 before34:{big:"🔐",h:"Módulo profundo",
  p:["Lo que sigue son <b>8 preguntas más íntimas</b>: sexualidad y vida interior. Son incómodas a propósito — porque los matches que fallan, fallan casi siempre en lo que nadie preguntó a tiempo.",
     "Nadie las lee más que el algoritmo. Preferimos un match menos a un match falso."],btn:"Estoy listo/a"},
};

/* ============ ESTADO (solo en memoria — demo) ============ */
let queue = [];
Q.forEach(q=>{
  if(q.n===1) queue.push({t:"inter",k:"start"});
  if(q.n===19) queue.push({t:"inter",k:"before19"});
  if(q.n===31) queue.push({t:"inter",k:"before31"});
  if(q.n===34) queue.push({t:"inter",k:"before34"});
  queue.push({t:"q",q});
});
queue.push({t:"end"});
let idx=0;
const answers={};   // n -> [respuestas por parte]

const app=document.getElementById('app');
const pwrap=document.getElementById('progresswrap');

function answeredCount(){
  return Q.filter(q=>{
    const a=answers[q.n];
    return a && a.some(v=>v!==undefined && v!==null && String(v).trim()!=="" && !(Array.isArray(v)&&v.length===0));
  }).length;
}
function isAnswered(q){
  const a=answers[q.n];
  return a && a.some(v=>v!==undefined && v!==null && String(v).trim()!=="" && !(Array.isArray(v)&&v.length===0));
}
function updateProgress(cur){
  if(!cur||cur.t!=="q"){pwrap.style.display="none";return;}
  pwrap.style.display="block";
  const q=cur.q;
  const inBlock=Q.filter(x=>x.b===q.b);
  const pos=inBlock.findIndex(x=>x.n===q.n)+1;
  document.getElementById('ptext-left').textContent=`Pregunta ${q.n} de 41`;
  document.getElementById('ptext-right').textContent=`${BLOCKS[q.b]} · ${pos} de ${inBlock.length}`;
  document.getElementById('pfill').style.width=(100*answeredCount()/41)+"%";
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function render(){
  const cur=queue[idx];
  updateProgress(cur);
  window.scrollTo({top:0});
  if(!cur){idx=queue.length-1;return render();}

  if(cur.t==="inter"){
    const it=INTERS[cur.k];
    app.innerHTML=`<div class="inter"><div class="big">${it.big}</div><h2>${it.h}</h2>
      ${it.p.map(x=>`<p>${x}</p>`).join("")}
      <div class="navbtns" style="justify-content:center">
        ${idx>0?`<button class="btn ghost" onclick="go(-1)">← Atrás</button>`:""}
        <button class="btn primary" style="margin:0" onclick="go(1)">${it.btn} →</button>
      </div></div>`;
    return;
  }
  if(cur.t==="end"){ return renderEnd(); }

  const q=cur.q;
  if(!answers[q.n]) answers[q.n]=[];
  const a=answers[q.n];

  let helps="";
  if(q.help){
    if(q.help.why)   helps+=`<details><summary>¿Por qué preguntamos esto?</summary><div class="dbody">${q.help.why}</div></details>`;
    if(q.help.ex)    helps+=`<details><summary>Ejemplo de respuesta real</summary><div class="dbody">${q.help.ex}</div></details>`;
    if(q.help.start) helps+=`<details><summary>¿No sabes por dónde empezar?</summary><div class="dbody">${q.help.start}</div></details>`;
  }

  const partsHtml=q.parts.map((p,pi)=>{
    const val=a[pi];
    let inner="";
    if(p.k==="choice"){
      inner=`<div class="opts">`+p.o.map((o,oi)=>
        `<button class="opt ${val===oi?"sel":""}" onclick="setAns(${q.n},${pi},${oi})">${o}</button>`).join("")+`</div>`;
    }else if(p.k==="scale"){
      inner=`<div class="scale">`+[1,2,3,4,5].map(v=>
        `<button class="opt ${val===v?"sel":""}" onclick="setAns(${q.n},${pi},${v})">${v}</button>`).join("")+`</div>
        <div class="scale-ends"><span>${p.lo}</span><span>${p.hi}</span></div>`;
    }else if(p.k==="text"){
      inner=`<textarea style="min-height:${p.min||150}px" oninput="setText(${q.n},${pi},this.value)"
        placeholder="Escribe con calma. Aquí no hay prisa.">${val?esc(val):""}</textarea>`;
    }else if(p.k==="text1"){
      inner=`<input type="text" value="${val?esc(val):""}" oninput="setText(${q.n},${pi},this.value)">`;
    }else if(p.k==="rank"){
      const order=Array.isArray(val)?val:[];
      inner=`<div class="rank-hint">Toca las opciones en orden. Vuelve a tocar para quitar.</div>
        <div class="opts rank">`+p.o.map((o,oi)=>{
          const posn=order.indexOf(oi);
          return `<button class="opt ${posn>=0?"sel":""}" onclick="toggleRank(${q.n},${pi},${oi})">
            <span class="num ${posn>=0?"":"empty"}">${posn>=0?posn+1:"·"}</span>${o}</button>`;
        }).join("")+`</div>
        <button class="reset" onclick="setAns(${q.n},${pi},[])">Reiniciar orden</button>`;
    }
    return `<div class="part">${p.l?`<div class="plabel">${p.l}</div>`:""}${inner}</div>`;
  }).join("");

  app.innerHTML=`
    <div class="qnum">Bloque ${q.b} · ${BLOCKS[q.b]}</div>
    <h2 class="qtitle">${q.t}</h2>
    ${q.note?`<p class="qnote">${q.note}</p>`:""}
    <div class="helps">${helps}</div>
    <div class="parts">${partsHtml}</div>
    <div class="savebar"><b>Demo:</b> en la versión real esto ya estaría guardado ✓</div>
    <div class="navbtns">
      <button class="btn ghost" onclick="go(-1)">← Atrás</button>
      <button class="btn later" onclick="defer()">Lo pienso después</button>
      <button class="btn primary" onclick="go(1)">Siguiente →</button>
    </div>`;
}

function renderEnd(){
  pwrap.style.display="none";
  const done=answeredCount();
  app.innerHTML=`<div class="inter"><div class="big">${done===41?"💘":"🌱"}</div>
    <h2>${done===41?"Cuestionario completo":"Así se ve tu avance"}</h2>
    <p>Respondiste <b>${done} de 41</b> preguntas.</p>
    <p>${done===41
      ?"En la versión real, tu perfil entraría al matching esta misma noche. Y luego: silencio — hasta que alguien supere el 95%. Cuando tu teléfono suene, va en serio."
      :"En la versión real todo esto estaría guardado y podrías volver mañana. En el demo, al cerrar la página se pierde — te avisamos con cariño."}</p>
    <p style="font-size:14px;color:var(--muted)">Toca cualquier pregunta para revisarla o editarla:</p></div>
    <div>`+Q.map(q=>{
      const ok=isAnswered(q);
      return `<div class="summary-item" onclick="jumpTo(${q.n})">
        <span class="st ${ok?"done-check":"pend"}">${ok?"✓":"○"}</span>
        <span style="min-width:30px;color:var(--muted)">${q.n}.</span>
        <span class="tt">${q.t}</span></div>`;
    }).join("")+`</div>
    <div class="navbtns" style="justify-content:center;margin-top:30px">
      <a class="btn primary" style="margin:0;text-decoration:none" href="index.html">Volver al sitio</a>
    </div>`;
}

/* acciones */
function go(d){ idx=Math.max(0,Math.min(queue.length-1,idx+d)); render(); }
function setAns(n,pi,v){ answers[n][pi]=v; render(); }
function setText(n,pi,v){ answers[n][pi]=v;
  const cur=queue[idx]; if(cur&&cur.t==="q") document.getElementById('pfill').style.width=(100*answeredCount()/41)+"%";
}
function toggleRank(n,pi,oi){
  let o=Array.isArray(answers[n][pi])?answers[n][pi].slice():[];
  const at=o.indexOf(oi);
  if(at>=0) o.splice(at,1); else o.push(oi);
  answers[n][pi]=o; render();
}
function defer(){
  const cur=queue[idx];
  if(cur&&cur.t==="q"){
    queue.splice(idx,1);
    queue.splice(queue.length-1,0,cur); // antes de la pantalla final
    render();
  }
}
function jumpTo(n){
  const qi=queue.findIndex(x=>x.t==="q"&&x.q.n===n);
  if(qi>=0){idx=qi;render();}
}
render();
</script>
</body>
</html>
